<!--
  Asistente virtual Furent — widget flotante.
  Se incluye desde fragments/layout.html solo si `assistantEnabled` es verdadero.
  Los estilos van embebidos y con prefijo `fa-` para no depender de la compilación de Tailwind.
  El sistema visual (tokens) vive en `#furent-assistant-panel` / `#furent-assistant-launcher`.

  El asistente tiene:
   - Un botón flotante a la izquierda ("Mis chats") con su cajón de historial.
   - Un panel lateral izquierdo dentro del chat para entradas estructuradas (formulario de evento,
     calendario de fechas, bolsa y seguimiento de alquiler), de modo que la conversación no se
     sature con campos y funciones densas.
-->
<div th:fragment="assistantWidget" xmlns:th="http://www.thymeleaf.org">

    <style>
        /* ─────────────────────────────────────────────────────────────
           Tokens del widget — "atelier cálido"
           Toda medida de los componentes sale de aquí. Si un valor no
           está en este bloque, no debería aparecer más abajo.
           ───────────────────────────────────────────────────────────── */
        #furent-assistant-launcher,
        #furent-assistant-history-toggle,
        #furent-assistant-history,
        #furent-assistant-panel {
            /* Tipografía (escala fija, Inter de marca) */
            --fa-font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            --fa-2xs: 10.5px;
            --fa-xs: 11.5px;
            --fa-sm: 12.5px;
            --fa-md: 13.5px;
            --fa-lg: 15px;
            --fa-xl: 17px;

            /* Espacio (base 4) */
            --fa-s1: 4px;  --fa-s2: 8px;  --fa-s3: 12px;
            --fa-s4: 16px; --fa-s5: 20px; --fa-s6: 24px;

            /* Color: marfil cálido + un solo acento terracota */
            --fa-surface: #ffffff;
            --fa-surface-2: #faf6f1;
            --fa-surface-3: #f4ede4;
            --fa-ink: #241c15;
            --fa-ink-2: #6b5f55;
            --fa-ink-3: #9a8e82;
            --fa-line: #efe7de;
            --fa-line-2: #e6dacb;
            --fa-accent: #e07a3a;
            --fa-accent-strong: #c2630f;
            --fa-accent-soft: #fff3e8;
            --fa-accent-line: #f6d7bc;

            /* Forma */
            --fa-r-xs: 8px; --fa-r-sm: 10px; --fa-r: 14px;
            --fa-r-lg: 18px; --fa-r-xl: 22px; --fa-r-pill: 9999px;
            --fa-shadow-1: 0 1px 2px rgba(36, 28, 21, .06);
            --fa-shadow-2: 0 24px 60px -20px rgba(36, 28, 21, .35);
            --fa-shadow-accent: 0 8px 18px -10px rgba(194, 99, 15, .8);

            /* Movimiento */
            --fa-dur-fast: 120ms;
            --fa-dur: 200ms;
            --fa-dur-slow: 320ms;
            --fa-ease: cubic-bezier(.2, 0, 0, 1);
            --fa-ease-out: cubic-bezier(.16, 1, .3, 1);

            font-family: var(--fa-font);
            -webkit-font-smoothing: antialiased;
        }
        #furent-assistant-panel,
        #furent-assistant-panel *, #furent-assistant-panel *::before, #furent-assistant-panel *::after,
        #furent-assistant-launcher,
        #furent-assistant-launcher *, #furent-assistant-launcher *::before, #furent-assistant-launcher *::after,
        #furent-assistant-history-toggle,
        #furent-assistant-history-toggle *,
        #furent-assistant-history,
        #furent-assistant-history * {
            box-sizing: border-box;
        }

        /* Mientras el asistente está abierto, la página de fondo no debe desplazarse. */
        body.fa-noscroll, html.fa-noscroll { overflow: hidden; }

        /* ───────── Lanzador ───────── */
        #furent-assistant-launcher {
            position: fixed; right: var(--fa-s6); bottom: var(--fa-s6); z-index: 111;
            width: 60px; height: 60px; border: none; cursor: pointer;
            border-radius: var(--fa-r-pill); color: #fff;
            background: linear-gradient(140deg, #e88a4c, #c2630f);
            box-shadow: 0 14px 32px -8px rgba(194, 99, 15, .55);
            display: flex; align-items: center; justify-content: center;
            transition: transform var(--fa-dur) var(--fa-ease-out), box-shadow var(--fa-dur) var(--fa-ease-out);
        }
        #furent-assistant-launcher:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 20px 42px -10px rgba(194, 99, 15, .62); }
        #furent-assistant-launcher:active { transform: translateY(-1px) scale(.98); }
        #furent-assistant-launcher:focus-visible { outline: 3px solid rgba(224, 122, 58, .5); outline-offset: 3px; }
        #furent-assistant-launcher::after {
            content: ''; position: absolute; inset: 0; border-radius: var(--fa-r-pill);
            border: 2px solid rgba(224, 122, 58, .45); animation: fa-pulse 2.6s var(--fa-ease-out) infinite;
        }
        @keyframes fa-pulse {
            0% { transform: scale(1); opacity: .55; }
            100% { transform: scale(1.75); opacity: 0; }
        }
        #furent-assistant-launcher[hidden] { display: none; }
        .fa-launcher-badge {
            position: absolute; top: -3px; right: -3px; min-width: 19px; height: 19px; padding: 0 5px;
            border-radius: var(--fa-r-pill); background: #241c15; color: #fff; font-size: var(--fa-2xs); font-weight: 700;
            display: none; align-items: center; justify-content: center; border: 2px solid #fff;
        }

        /* ───────── Botón e historial de chats (izquierda) ───────── */
        #furent-assistant-history-toggle {
            position: fixed; left: var(--fa-s6); bottom: var(--fa-s6); z-index: 111;
            height: 44px; padding: 0 16px 0 12px; border: 1px solid var(--fa-line-2); cursor: pointer;
            border-radius: var(--fa-r-pill); color: var(--fa-ink-2); background: var(--fa-surface);
            box-shadow: 0 12px 28px -12px rgba(36, 28, 21, .35);
            display: inline-flex; align-items: center; gap: 8px;
            font-size: var(--fa-sm); font-weight: 700; font-family: inherit;
            transition: transform var(--fa-dur) var(--fa-ease-out), border-color var(--fa-dur) var(--fa-ease), color var(--fa-dur) var(--fa-ease);
        }
        #furent-assistant-history-toggle:hover { transform: translateY(-2px); border-color: var(--fa-accent-line); color: var(--fa-accent-strong); }
        #furent-assistant-history-toggle:focus-visible { outline: 3px solid rgba(224, 122, 58, .4); outline-offset: 2px; }
        #furent-assistant-history-toggle[aria-expanded="true"] { border-color: var(--fa-accent); color: var(--fa-accent-strong); background: var(--fa-accent-soft); }
        #furent-assistant-history-toggle[hidden] { display: none; }
        #furent-assistant-history-toggle svg { flex: 0 0 auto; }

        #furent-assistant-history {
            position: fixed; left: var(--fa-s6); bottom: 84px; z-index: 130;
            width: min(340px, calc(100vw - 2rem));
            max-height: min(72vh, 560px);
            background: var(--fa-surface); border: 1px solid var(--fa-line); border-radius: var(--fa-r-xl);
            box-shadow: var(--fa-shadow-2); overflow: hidden; display: flex; flex-direction: column;
            animation: fa-pop var(--fa-dur) var(--fa-ease-out);
        }
        #furent-assistant-history[hidden] { display: none; }
        .fa-hist-head { display: flex; align-items: center; gap: var(--fa-s2); padding: var(--fa-s4) var(--fa-s4) var(--fa-s2); }
        .fa-hist-head h3 { margin: 0; font-size: var(--fa-lg); font-weight: 800; color: var(--fa-ink); flex: 1 1 auto; }
        .fa-hist-close { background: var(--fa-surface-3); border: none; cursor: pointer; width: 30px; height: 30px; border-radius: var(--fa-r-sm); color: var(--fa-ink-2); display: inline-flex; align-items: center; justify-content: center; padding: 0; line-height: 0; transition: background var(--fa-dur) var(--fa-ease), transform var(--fa-dur-fast) var(--fa-ease); }
        .fa-hist-close:hover { background: #ece2d6; }
        .fa-hist-close:active { transform: scale(.94); }
        .fa-hist-close svg { display: block; }
        .fa-hist-list { overflow-y: auto; padding: var(--fa-s2) var(--fa-s3) var(--fa-s3); display: flex; flex-direction: column; gap: var(--fa-s2); scrollbar-width: thin; }
        .fa-hist-empty { padding: var(--fa-s5) var(--fa-s4); text-align: center; color: var(--fa-ink-3); font-size: var(--fa-sm); }
        .fa-hist-item { display: flex; align-items: stretch; gap: var(--fa-s2); }
        .fa-hist-open {
            flex: 1 1 auto; min-width: 0; text-align: left; cursor: pointer; font-family: inherit;
            background: var(--fa-surface-2); border: 1px solid var(--fa-line); border-radius: var(--fa-r); padding: 10px 12px;
            transition: border-color var(--fa-dur) var(--fa-ease), background var(--fa-dur) var(--fa-ease);
        }
        .fa-hist-open:hover { border-color: var(--fa-accent-line); background: var(--fa-accent-soft); }
        .fa-hist-open[data-active="true"] { border-color: var(--fa-accent); background: var(--fa-accent-soft); }
        .fa-hist-title { display: block; font-size: var(--fa-md); font-weight: 700; color: var(--fa-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .fa-hist-meta { display: block; margin-top: 2px; font-size: var(--fa-2xs); color: var(--fa-ink-3); }
        .fa-hist-del {
            flex: 0 0 auto; width: 38px; border: 1px solid var(--fa-line); background: var(--fa-surface); border-radius: var(--fa-r);
            color: var(--fa-ink-3); cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: color var(--fa-dur) var(--fa-ease), border-color var(--fa-dur) var(--fa-ease), background var(--fa-dur) var(--fa-ease);
        }
        .fa-hist-del:hover { color: #b91c1c; border-color: #fecaca; background: #fef2f2; }
        .fa-hist-new {
            margin: 0 var(--fa-s3) var(--fa-s3); padding: 11px 12px; cursor: pointer; font-family: inherit;
            border: none; border-radius: var(--fa-r); background: var(--fa-accent); color: #fff; font-size: var(--fa-sm); font-weight: 800;
            box-shadow: var(--fa-shadow-accent);
        }
        .fa-hist-new:hover { background: var(--fa-accent-strong); }

        /* ───────── Panel principal ───────── */
        #furent-assistant-panel {
            position: fixed; right: var(--fa-s6); bottom: var(--fa-s6); z-index: 120;
            width: min(408px, calc(100vw - 2rem));
            height: min(660px, calc(100vh - 2rem));
            height: min(660px, calc(100dvh - 2rem));
            background: var(--fa-surface); border-radius: var(--fa-r-xl); overflow: hidden;
            display: flex; flex-direction: column;
            border: 1px solid var(--fa-line);
            box-shadow: var(--fa-shadow-2);
            animation: fa-pop var(--fa-dur-slow) var(--fa-ease-out);
            transition: width var(--fa-dur) var(--fa-ease-out);
        }
        #furent-assistant-panel[hidden] { display: none; }
        #furent-assistant-panel.fa-wide { width: min(768px, calc(100vw - 2rem)); }
        @keyframes fa-pop {
            from { opacity: 0; transform: translateY(16px) scale(.97); }
            to { opacity: 1; transform: none; }
        }

        .fa-header {
            position: relative; display: flex; align-items: center; gap: var(--fa-s3);
            padding: var(--fa-s3) var(--fa-s4);
            color: var(--fa-ink); background: var(--fa-surface); flex: 0 0 auto;
            border-bottom: 1px solid var(--fa-line);
        }
        .fa-avatar {
            width: 40px; height: 40px; border-radius: var(--fa-r); background: #fff;
            border: 1px solid var(--fa-line-2); overflow: hidden;
            display: flex; align-items: center; justify-content: center; flex: 0 0 auto;
        }
        .fa-avatar img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.34); display: block; }
        .fa-head-text { min-width: 0; }
        .fa-header h2 { margin: 0; font-size: var(--fa-lg); font-weight: 800; letter-spacing: -.01em; color: var(--fa-ink); }
        .fa-header p { margin: 1px 0 0; font-size: var(--fa-xs); font-weight: 500; color: var(--fa-ink-3); }
        .fa-close {
            margin-left: auto; background: var(--fa-surface-3); border: none; cursor: pointer;
            width: 36px; height: 36px; border-radius: var(--fa-r-sm); color: var(--fa-ink-2); display: flex; align-items: center; justify-content: center;
            transition: background var(--fa-dur) var(--fa-ease), transform var(--fa-dur-fast) var(--fa-ease);
        }
        .fa-close:hover { background: #ece2d6; }
        .fa-close:active { transform: scale(.94); }
        .fa-close:focus-visible { outline: 2px solid var(--fa-accent); outline-offset: 2px; }

        /* Cuerpo: [panel lateral | chat] */
        .fa-body { flex: 1 1 auto; min-height: 0; display: flex; }
        .fa-main { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; flex-direction: column; }

        .fa-side {
            flex: 0 0 auto; width: 300px; min-width: 0; display: flex; flex-direction: column;
            background: var(--fa-surface-2); border-right: 1px solid var(--fa-line);
        }
        .fa-side[hidden] { display: none; }
        .fa-side-head { display: flex; align-items: center; gap: var(--fa-s2); padding: var(--fa-s3) var(--fa-s4) var(--fa-s2); border-bottom: 1px solid var(--fa-line); }
        .fa-side-head h3 { margin: 0; flex: 1 1 auto; font-size: var(--fa-md); font-weight: 800; color: var(--fa-ink); }
        .fa-side-close { background: var(--fa-surface); border: 1px solid var(--fa-line-2); cursor: pointer; width: 28px; height: 28px; border-radius: var(--fa-r-xs); color: var(--fa-ink-2); display: inline-flex; align-items: center; justify-content: center; padding: 0; line-height: 0; transition: background var(--fa-dur) var(--fa-ease), transform var(--fa-dur-fast) var(--fa-ease); }
        .fa-side-close:hover { background: var(--fa-surface-3); }
        .fa-side-close:active { transform: scale(.94); }
        .fa-side-close svg { display: block; }
        .fa-side-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: var(--fa-s3) var(--fa-s4) var(--fa-s4); scrollbar-width: none; -ms-overflow-style: none; }
        .fa-side-body::-webkit-scrollbar { display: none; }
        .fa-view[hidden] { display: none; }

        .fa-messages {
            flex: 1 1 auto; min-height: 120px; overflow-y: auto; overflow-x: hidden; padding: var(--fa-s4);
            background: var(--fa-surface); display: flex; flex-direction: column; gap: var(--fa-s3);
            scroll-behavior: smooth; scrollbar-width: thin; scrollbar-color: var(--fa-line-2) transparent;
            /* Al llegar al final, el scroll no debe encadenarse con el de la página. */
            overscroll-behavior: contain;
        }
        .fa-messages::-webkit-scrollbar { width: 8px; }
        .fa-messages::-webkit-scrollbar-thumb { background: var(--fa-line-2); border-radius: var(--fa-r-pill); border: 2px solid transparent; background-clip: content-box; }

        .fa-row { display: flex; gap: var(--fa-s2); max-width: 100%; }
        .fa-row.user { justify-content: flex-end; }
        .fa-row.assistant { align-items: flex-end; }
        .fa-enter { animation: fa-rise var(--fa-dur-slow) var(--fa-ease-out) both; }
        @keyframes fa-rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

        /* Avatar junto a la burbuja del asistente (estilo de referencia) */
        .fa-avatar-sm { width: 28px; height: 28px; border-radius: var(--fa-r-pill); overflow: hidden; flex: 0 0 auto; background: var(--fa-accent-soft); border: 1px solid var(--fa-accent-line); }
        .fa-avatar-sm img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.34); display: block; }

        .fa-bubble {
            max-width: 84%; padding: 10px 13px; border-radius: var(--fa-r-lg);
            font-size: var(--fa-md); line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere;
        }
        .fa-bubble.assistant { background: var(--fa-surface-2); color: var(--fa-ink); border: 1px solid var(--fa-line); border-bottom-left-radius: var(--fa-r-xs); }
        .fa-bubble.user { background: linear-gradient(140deg, #e88a4c, #c2630f); color: #fff; border-bottom-right-radius: var(--fa-r-xs); }
        .fa-bubble.error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }

        /* Burbuja de nota (no es el asistente): aviso temporal al iniciar el chat. */
        .fa-note-row { display: flex; justify-content: center; }
        .fa-note {
            max-width: 92%; text-align: center; font-size: var(--fa-2xs); line-height: 1.5; color: var(--fa-ink-3);
            background: var(--fa-surface-2); border: 1px dashed var(--fa-line-2); border-radius: var(--fa-r);
            padding: var(--fa-s2) var(--fa-s3);
        }

        /* Markdown mínimo que compone assistant.js con nodos seguros */
        .fa-bubble.assistant > *:first-child { margin-top: 0; }
        .fa-bubble.assistant > *:last-child { margin-bottom: 0; }
        .fa-md-p { margin: 0 0 var(--fa-s2); }
        .fa-md-h { margin: var(--fa-s1) 0 var(--fa-s2); font-weight: 800; }
        .fa-bubble ul, .fa-bubble ol { margin: var(--fa-s1) 0 var(--fa-s2); padding-left: var(--fa-s4); }
        .fa-bubble li { margin: 3px 0; }
        .fa-bubble strong { font-weight: 800; color: var(--fa-ink); }
        .fa-md-code {
            background: rgba(36, 28, 21, .07); border-radius: 5px; padding: 1px 5px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: var(--fa-sm);
        }
        .fa-md-link { color: var(--fa-accent-strong); text-decoration: underline; text-underline-offset: 2px; overflow-wrap: anywhere; }
        /* Resaltado de datos importantes (==texto==). */
        .fa-hl { background: var(--fa-accent-soft); color: var(--fa-accent-strong); font-weight: 800; border-radius: 4px; padding: 0 4px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }

        .fa-typing { display: inline-flex; gap: 4px; align-items: center; padding: 2px 0; }
        .fa-typing span { width: 6px; height: 6px; border-radius: var(--fa-r-pill); background: var(--fa-accent); opacity: .4; animation: fa-blink 1.2s infinite; }
        .fa-typing span:nth-child(2) { animation-delay: .18s; }
        .fa-typing span:nth-child(3) { animation-delay: .36s; }
        @keyframes fa-blink { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }

        /* ───────── Tarjetas ───────── */
        .fa-card { background: var(--fa-surface); border: 1px solid var(--fa-line); border-radius: var(--fa-r-lg); overflow: hidden; width: 100%; box-shadow: var(--fa-shadow-1); }
        .fa-card-media { display: flex; gap: var(--fa-s3); padding: var(--fa-s3); align-items: center; }
        .fa-card-media img { width: 58px; height: 58px; border-radius: var(--fa-r-sm); object-fit: cover; background: var(--fa-surface-3); flex: 0 0 auto; }
        .fa-card-name { font-size: var(--fa-md); font-weight: 700; color: var(--fa-ink); margin: 0 0 2px; }
        .fa-card-meta { font-size: var(--fa-xs); color: var(--fa-ink-3); margin: 0; }
        .fa-card-price { font-size: var(--fa-md); font-weight: 800; color: var(--fa-accent-strong); white-space: nowrap; font-variant-numeric: tabular-nums; }
        .fa-card-actions { display: flex; gap: var(--fa-s2); padding: 0 var(--fa-s3) var(--fa-s3); }

        /* ───────── Botones ───────── */
        .fa-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            flex: 1 1 auto; border: none; cursor: pointer; border-radius: var(--fa-r-sm); padding: 10px 12px;
            font-size: var(--fa-sm); font-weight: 700; font-family: inherit; line-height: 1.1;
            transition: background var(--fa-dur) var(--fa-ease), transform var(--fa-dur-fast) var(--fa-ease), box-shadow var(--fa-dur) var(--fa-ease);
        }
        .fa-btn svg { flex: 0 0 auto; }
        .fa-btn:active { transform: scale(.97); }
        .fa-btn:focus-visible { outline: 2px solid var(--fa-accent); outline-offset: 2px; }
        .fa-btn:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }
        .fa-btn-primary { background: var(--fa-accent); color: #fff; box-shadow: var(--fa-shadow-accent); }
        .fa-btn-primary:hover { background: var(--fa-accent-strong); }
        .fa-btn-ghost { background: var(--fa-surface-3); color: var(--fa-ink-2); }
        .fa-btn-ghost:hover { background: #ece2d6; }
        .fa-btn-wa { background: #25d366; color: #fff; }
        .fa-btn-wa:hover { background: #1ebe5a; }

        /* ───────── Tarjeta de cotización (recibo) ───────── */
        .fa-quote { background: var(--fa-surface); border: 1px solid var(--fa-line); border-radius: var(--fa-r-lg); padding: var(--fa-s3); width: 100%; box-shadow: var(--fa-shadow-1); }
        .fa-quote-head { display: flex; align-items: center; gap: var(--fa-s2); margin-bottom: var(--fa-s3); }
        .fa-quote-ico { width: 28px; height: 28px; border-radius: var(--fa-r-xs); background: var(--fa-accent-soft); color: var(--fa-accent-strong); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
        .fa-quote h4 { margin: 0; font-size: var(--fa-md); font-weight: 800; color: var(--fa-ink); }
        .fa-quote-dates { margin: 1px 0 0; font-size: var(--fa-xs); color: var(--fa-ink-3); font-weight: 600; }
        .fa-quote-item { display: flex; justify-content: space-between; align-items: center; gap: var(--fa-s2); font-size: var(--fa-sm); padding: var(--fa-s2) 0; color: var(--fa-ink-2); }
        .fa-quote-item + .fa-quote-item { border-top: 1px solid var(--fa-line); }
        .fa-quote-thumb { width: 34px; height: 34px; border-radius: var(--fa-r-xs); object-fit: cover; background: var(--fa-surface-3); flex: 0 0 auto; }
        .fa-quote-item-main { display: flex; flex-direction: column; min-width: 0; flex: 1 1 auto; }
        .fa-quote-item-name { font-weight: 700; color: var(--fa-ink); font-size: var(--fa-sm); overflow: hidden; text-overflow: ellipsis; }
        .fa-quote-item-unit { font-size: var(--fa-2xs); color: var(--fa-ink-3); }
        .fa-quote-item-sub { font-weight: 800; white-space: nowrap; color: var(--fa-ink); font-variant-numeric: tabular-nums; flex: 0 0 auto; }

        .dark #furent-assistant-panel .fa-md-link { color: #f0a868; }
        .dark #furent-assistant-panel .fa-hl { background: #3a2a1c; color: #f5c088; }
        .dark #furent-assistant-panel .fa-quote-ico { background: #3a2a1c; color: #f0b483; }
        .dark #furent-assistant-panel .fa-btn-ghost:hover { background: #3f342a; }
        .dark #furent-assistant-panel .fa-chip { background: #2a231d; border-color: #54371d; color: #f0b483; }
        .dark #furent-assistant-panel .fa-chip:hover { background: #3a2a1c; }
        .dark #furent-assistant-panel .fa-tool { background: #2a231d; border-color: #453a30; color: #cbbdaf; }
        .dark #furent-assistant-panel .fa-tool:hover { background: #352c24; }
        .dark #furent-assistant-panel .fa-tool[aria-expanded="true"] { background: #3a2a1c; border-color: var(--fa-accent); color: #f0b483; }
        .dark #furent-assistant-panel .fa-plus { background: #2a231d; border-color: #453a30; color: #cbbdaf; }
        .dark #furent-assistant-panel .fa-control input,
        .dark #furent-assistant-panel .fa-control select,
        .dark #furent-assistant-panel .fa-control textarea { background: #2a231d; border-color: #453a30; color: #f5efe7; }
        .dark #furent-assistant-panel .fa-control input:focus,
        .dark #furent-assistant-panel .fa-control select:focus,
        .dark #furent-assistant-panel .fa-control textarea:focus { background: #2a231d; }
        .dark #furent-assistant-panel .fa-icon-btn { background: #2a231d; border-color: #453a30; color: #cbbdaf; }
        .dark #furent-assistant-panel .fa-icon-btn:hover { background: #3a2a1c; color: #f0b483; }
        .dark #furent-assistant-panel .fa-calendar-host .flatpickr-day.prevMonthDay,
        .dark #furent-assistant-panel .fa-calendar-host .flatpickr-day.nextMonthDay { color: #6b5f55; }
        .dark #furent-assistant-panel .fa-calendar-host .flatpickr-day.inRange { background: #4a3618; border-color: #4a3618; color: #f5c088; }
        .dark #furent-assistant-panel .fa-calendar-host .flatpickr-day.flatpickr-disabled { color: #6b5f55; }
        .dark #furent-assistant-panel .fa-calendar-host .flatpickr-day.is-reserved {
            color: #6b5f55; background: repeating-linear-gradient(45deg, #2a231d, #2a231d 4px, #352c24 4px, #352c24 8px);
        }
        .dark #furent-assistant-panel .fa-quote-stock { color: #fcd9a8; background: #3a2a12; border-color: #6b4a1e; }

        @media (max-width: 640px) {
            /* `width: 100%` (no `100vw`): en un elemento fixed resuelve contra el viewport
               sin contar la barra de scroll, así el panel no provoca desborde horizontal. */
            #furent-assistant-panel.fa-wide { width: 100%; }
            #furent-assistant-panel { left: 0; right: 0; bottom: 0; width: 100%; height: 100vh; height: 100dvh; border-radius: var(--fa-r-xl) var(--fa-r-xl) 0 0; border-bottom: none; }
            #furent-assistant-panel .fa-side { position: absolute; inset: 0; width: 100%; border-right: none; z-index: 5; }
            #furent-assistant-launcher { right: var(--fa-s4); bottom: var(--fa-s4); }
            #furent-assistant-history-toggle { left: var(--fa-s4); bottom: var(--fa-s4); }
            #furent-assistant-history { left: var(--fa-s4); right: var(--fa-s4); width: auto; bottom: 76px; }
        }

        @media (prefers-reduced-motion: reduce) {
            #furent-assistant-panel, #furent-assistant-history, .fa-enter, .fa-quick:not([hidden]),
            #furent-assistant-launcher::after, .fa-typing span, .fa-field, .fa-fp.flatpickr-calendar.animate.open { animation: none !important; }
            #furent-assistant-launcher, .fa-btn, .fa-chip, .fa-send, .fa-plus, .fa-close, .fa-tool,
            .fa-control input, .fa-control select, .fa-control textarea, .fa-icon-btn { transition: none !important; }
            .fa-messages { scroll-behavior: auto; }
        }
    </style>

    <!-- Lanzador -->
    <button type="button" id="furent-assistant-launcher"
            aria-label="Abrir asistente Furent" aria-expanded="false" aria-controls="furent-assistant-panel">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.625 12a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0H8.25m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0H12m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0h-.375m-13.5 3.01c0 1.6 1.123 2.994 2.707 3.227 1.129.166 2.27.293 3.423.379.35.026.67.21.865.501L12 21l2.755-4.133a1.14 1.14 0 0 1 .865-.501 48.17 48.17 0 0 0 3.423-.379c1.584-.233 2.707-1.626 2.707-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0 0 12 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v8.269Z"/>
        </svg>
        <span class="fa-launcher-badge" id="furent-assistant-badge" aria-hidden="true">1</span>
    </button>

    <!-- Botón flotante de historial (izquierda) -->
    <button type="button" id="furent-assistant-history-toggle" aria-label="Ver mis chats" aria-expanded="false" aria-controls="furent-assistant-history">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 8.25h9m-9 3.75h6M6.75 3.75h10.5A1.5 1.5 0 0 1 18.75 5.25v13.9l-2.6-1.5-2.6 1.5-2.6-1.5-2.6 1.5V5.25A1.5 1.5 0 0 1 6.75 3.75Z"/>
        </svg>
        <span>Mis chats</span>
    </button>

    <!-- Cajón de historial -->
    <section id="furent-assistant-history" hidden aria-label="Historial de chats"
             th:attr="data-list-url=@{/api/asistente/conversations}">
        <div class="fa-hist-head">
            <h3>Mis chats</h3>
            <button type="button" class="fa-hist-close" id="furent-assistant-history-close" aria-label="Cerrar historial">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
        <div class="fa-hist-list" id="furent-assistant-history-list" role="list"></div>
        <button type="button" class="fa-hist-new" id="furent-assistant-history-new">
            + Nuevo chat
        </button>
    </section>

    <!-- Panel del asistente -->
    <section id="furent-assistant-panel" hidden role="dialog" aria-modal="true" aria-labelledby="furent-assistant-title"
             th:attr="data-chat-url=@{/api/asistente/chat},data-authenticated=${currentUser != null}">
        <header class="fa-header">
            <div class="fa-avatar" aria-hidden="true">
                <img th:src="@{/images/furent-logo.png}" alt="">
            </div>
            <div class="fa-head-text">
                <h2 id="furent-assistant-title">Asistente Furi</h2>
            </div>
            <button type="button" class="fa-close" id="furent-assistant-close" aria-label="Cerrar asistente">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/>
                </svg>
            </button>
        </header>

        <div class="fa-body">
            <!-- Panel lateral izquierdo: campos, fechas, bolsa y seguimiento -->
            <aside class="fa-side" id="furent-assistant-side" hidden aria-label="Apoyo de la conversación">
                <div class="fa-side-head">
                    <h3 id="furent-assistant-side-title">Detalle</h3>
                    <button type="button" class="fa-side-close" id="furent-assistant-side-close" aria-label="Cerrar panel">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/>
                        </svg>
                    </button>
                </div>
                <div class="fa-side-body">
                    <div class="fa-view" id="furent-assistant-view-form" hidden></div>
                    <div class="fa-view" id="furent-assistant-view-fechas" hidden>
                        <div class="fa-calendar-host" id="furent-assistant-calendar-host">
                            <input type="text" class="fa-sr" id="furent-assistant-dates-input" tabindex="-1" aria-hidden="true" autocomplete="off">
                        </div>
                        <p class="fa-calendar-hint" id="furent-assistant-calendar-hint">Elige desde y hasta. Máximo 7 días por alquiler.</p>
                        <div class="fa-calendar-actions">
                            <button type="button" class="fa-icon-btn" id="furent-assistant-calendar-clear" aria-label="Limpiar fechas" title="Limpiar fechas">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 20h16"/>
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 5.5 8 11l3.5 3.5 5.5-5.5a2.47 2.47 0 0 0-3.5-3.5Z"/>
                                    <path stroke-linecap="round" stroke-linejoin="round" d="m9.5 12.5-3 3a1.5 1.5 0 0 0 0 2.1l.9.9a1.5 1.5 0 0 0 2.1 0l3-3"/>
                                </svg>
                            </button>
                            <button type="button" class="fa-btn fa-btn-primary" id="furent-assistant-calendar-use" disabled>Usar estas fechas</button>
                        </div>
                    </div>
                    <div class="fa-view" id="furent-assistant-view-bolsa" hidden></div>
                    <div class="fa-view" id="furent-assistant-view-reco" hidden></div>
                    <div class="fa-view" id="furent-assistant-view-alquiler" hidden></div>
                </div>
            </aside>

            <!-- Chat -->
            <div class="fa-main">
                <div class="fa-messages" id="furent-assistant-messages" role="log" aria-live="polite"></div>

                <div class="fa-composer">
                    <div class="fa-quick" id="furent-assistant-quick" hidden>
                        <button type="button" class="fa-tool" id="furent-assistant-quick-dates">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5"/>
                            </svg>
                            <span>Elegir fechas</span>
                        </button>
                        <button type="button" class="fa-tool" id="furent-assistant-quick-event">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 3.5l1.7 4.55L18.25 9.75l-4.55 1.7L12 16l-1.7-4.55L5.75 9.75l4.55-1.7L12 3.5Z"/>
                            </svg>
                            <span>Datos de mi evento</span>
                        </button>
                        <button type="button" class="fa-tool" id="furent-assistant-quick-bag">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M3 4h2l2.3 11.2a1.5 1.5 0 0 0 1.5 1.2h8.4a1.5 1.5 0 0 0 1.5-1.2L20.5 7H6"/>
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9.5 20.5a1 1 0 1 0 0-.01M17.5 20.5a1 1 0 1 0 0-.01"/>
                            </svg>
                            <span>Mi bolsa</span>
                        </button>
                        <button type="button" class="fa-tool" id="furent-assistant-quick-suggest" aria-expanded="false" aria-controls="furent-assistant-chips">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 3.5l1.7 4.55L18.25 9.75l-4.55 1.7L12 16l-1.7-4.55L5.75 9.75l4.55-1.7L12 3.5Z"/>
                            </svg>
                            <span>Sugerencias</span>
                        </button>
                    </div>

                    <div class="fa-suggestions" id="furent-assistant-chips" hidden>
                        <button type="button" class="fa-chip" data-prompt="Necesito sillas y mesas para una boda">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 1 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78Z"/></svg>
                            Sillas para una boda
                        </button>
                        <button type="button" class="fa-chip" data-prompt="Quiero organizar un cumpleaños para 50 personas">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3.5l1.7 4.55L18.25 9.75l-4.55 1.7L12 16l-1.7-4.55L5.75 9.75l4.55-1.7L12 3.5Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M18.5 15.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7.7-1.8Z"/></svg>
                            Organizar mi evento
                        </button>
                        <button type="button" class="fa-chip" data-prompt="¿Qué tengo en mi bolsa?">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M3 4h2l2.3 11.2a1.5 1.5 0 0 0 1.5 1.2h8.4a1.5 1.5 0 0 0 1.5-1.2L20.5 7H6"/><path stroke-linecap="round" stroke-linejoin="round" d="M9.5 20.5a1 1 0 1 0 0-.01M17.5 20.5a1 1 0 1 0 0-.01"/></svg>
                            Ver mi bolsa
                        </button>
                        <button type="button" class="fa-chip" data-prompt="¿Cómo va el estado de mi alquiler?">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3.75h10.5A1.5 1.5 0 0 1 18.75 5.25v13.9l-2.6-1.5-2.6 1.5-2.6-1.5-2.6 1.5V5.25A1.5 1.5 0 0 1 6.75 3.75Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M9.5 8.5h5M9.5 12h3.5"/></svg>
                            Estado de mi alquiler
                        </button>
                    </div>

                    <div class="fa-input-row">
                        <button type="button" class="fa-plus" id="furent-assistant-plus" aria-label="Más opciones" aria-expanded="false">
                            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 5v14M5 12h14"/>
                            </svg>
                        </button>
                        <label class="fa-sr" for="furent-assistant-input">Escribe tu mensaje</label>
                        <textarea id="furent-assistant-input" class="fa-input" rows="1" maxlength="1000"
                                  placeholder="Escribe tu duda o lo que necesitas..."></textarea>
                        <button type="button" class="fa-send" id="furent-assistant-send" aria-label="Enviar mensaje">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M6 12 3.269 3.125A59.769 59.769 0 0 1 21.485 12 59.768 59.768 0 0 1 3.27 20.875L5.999 12Zm0 0h7.5"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script th:src="@{/js/assistant.js}" defer></script>
</div>
