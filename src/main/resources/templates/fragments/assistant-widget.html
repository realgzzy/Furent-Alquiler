<!--
  Asistente virtual Furent — widget flotante.
  Se incluye desde fragments/layout.html solo si `assistantEnabled` es verdadero.
  Los estilos van embebidos y con prefijo `fa-` para no depender de la compilación de Tailwind.
  El sistema visual (tokens) vive en `#furent-assistant-panel` / `#furent-assistant-launcher`.

  El asistente tiene:
   - La opción "Mis chats" en el menú del compositor; abre el historial dentro del panel, sobre la
     conversación, donde también se confirma el borrado de cada chat.
   - Un panel lateral izquierdo dentro del chat para entradas estructuradas (formulario de evento,
     calendario de fechas, bolsa y seguimiento de alquiler), de modo que la conversación no se
     sature con campos y funciones densas.
-->
<div th:fragment="assistantWidget" xmlns:th="http://www.thymeleaf.org">

    <style>
        /* ─────────────────────────────────────────────────────────────
           Tokens del widget — "atelier cálido"
           Toda medida de los componentes sale de aquí. Si un valor no
           está en este bloque, no debería aparecer más abajo.
           ───────────────────────────────────────────────────────────── */
        #furent-assistant-launcher,
        #furent-assistant-panel {
            /* Tipografía (escala fija, Inter de marca) */
            --fa-font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            --fa-2xs: 10.5px;
            --fa-xs: 11.5px;
            --fa-sm: 12.5px;
            --fa-md: 13.5px;
            --fa-lg: 15px;
            --fa-xl: 17px;

            /* Espacio (base 4) */
            --fa-s1: 4px;  --fa-s2: 8px;  --fa-s3: 12px;
            --fa-s4: 16px; --fa-s5: 20px; --fa-s6: 24px;

            /* Color: marfil cálido + un solo acento terracota */
            --fa-surface: #ffffff;
            --fa-surface-2: #faf6f1;
            --fa-surface-3: #f4ede4;
            --fa-ink: #241c15;
            --fa-ink-2: #6b5f55;
            --fa-ink-3: #9a8e82;
            --fa-line: #efe7de;
            --fa-line-2: #e6dacb;
            --fa-accent: #e07a3a;
            --fa-accent-strong: #c2630f;
            --fa-accent-soft: #fff3e8;
            --fa-accent-line: #f6d7bc;

            /* Forma */
            --fa-r-xs: 8px; --fa-r-sm: 10px; --fa-r: 14px;
            --fa-r-lg: 18px; --fa-r-xl: 22px; --fa-r-pill: 9999px;
            --fa-shadow-1: 0 1px 2px rgba(36, 28, 21, .06);
            --fa-shadow-2: 0 24px 60px -20px rgba(36, 28, 21, .35);
            --fa-shadow-accent: 0 8px 18px -10px rgba(194, 99, 15, .8);

            /* Movimiento */
            --fa-dur-fast: 120ms;
            --fa-dur: 200ms;
            --fa-dur-slow: 320ms;
            --fa-ease: cubic-bezier(.2, 0, 0, 1);
            --fa-ease-out: cubic-bezier(.16, 1, .3, 1);

            font-family: var(--fa-font);
            -webkit-font-smoothing: antialiased;
        }
        #furent-assistant-panel,
        #furent-assistant-panel *, #furent-assistant-panel *::before, #furent-assistant-panel *::after,
        #furent-assistant-launcher,
        #furent-assistant-launcher *, #furent-assistant-launcher *::before, #furent-assistant-launcher *::after {
            box-sizing: border-box;
        }

        /* Mientras el asistente está abierto, la página de fondo no debe desplazarse. */
        body.fa-noscroll, html.fa-noscroll { overflow: hidden; }

        /* ───────── Lanzador ───────── */
        #furent-assistant-launcher {
            position: fixed; right: var(--fa-s6); bottom: var(--fa-s6); z-index: 111;
            width: 60px; height: 60px; border: none; cursor: pointer;
            border-radius: var(--fa-r-pill); color: #fff;
            background: linear-gradient(140deg, #e88a4c, #c2630f);
            box-shadow: 0 14px 32px -8px rgba(194, 99, 15, .55);
            display: flex; align-items: center; justify-content: center;
            transition: transform var(--fa-dur) var(--fa-ease-out), box-shadow var(--fa-dur) var(--fa-ease-out);
        }
        #furent-assistant-launcher:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 20px 42px -10px rgba(194, 99, 15, .62); }
        #furent-assistant-launcher:active { transform: translateY(-1px) scale(.98); }
        #furent-assistant-launcher:focus-visible { outline: 3px solid rgba(224, 122, 58, .5); outline-offset: 3px; }
        #furent-assistant-launcher::after {
            content: ''; position: absolute; inset: 0; border-radius: var(--fa-r-pill);
            border: 2px solid rgba(224, 122, 58, .45); animation: fa-pulse 2.6s var(--fa-ease-out) infinite;
        }
        @keyframes fa-pulse {
            0% { transform: scale(1); opacity: .55; }
            100% { transform: scale(1.75); opacity: 0; }
        }
        #furent-assistant-launcher[hidden] { display: none; }
        .fa-launcher-img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; display: block; }
        .fa-launcher-badge {
            position: absolute; top: -3px; right: -3px; min-width: 19px; height: 19px; padding: 0 5px;
            border-radius: var(--fa-r-pill); background: #241c15; color: #fff; font-size: var(--fa-2xs); font-weight: 700;
            display: none; align-items: center; justify-content: center; border: 2px solid #fff;
        }

        /* ───────── Historial de chats (dentro del panel) ───────── */
        #furent-assistant-history {
            position: absolute; inset: 0; z-index: 15;
            background: var(--fa-surface);
            display: flex; flex-direction: column; overflow: hidden;
            animation: fa-pop var(--fa-dur-fast) var(--fa-ease-out);
        }
        #furent-assistant-history[hidden] { display: none; }
        .fa-hist-head { display: flex; align-items: center; gap: var(--fa-s2); padding: var(--fa-s4) var(--fa-s4) var(--fa-s2); }
        .fa-hist-head h3 { margin: 0; font-size: var(--fa-lg); font-weight: 800; color: var(--fa-ink); flex: 1 1 auto; }
        .fa-hist-close { background: var(--fa-surface-3); border: none; cursor: pointer; width: 30px; height: 30px; border-radius: var(--fa-r-sm); color: var(--fa-ink-2); display: inline-flex; align-items: center; justify-content: center; padding: 0; line-height: 0; transition: background var(--fa-dur) var(--fa-ease), transform var(--fa-dur-fast) var(--fa-ease); }
        .fa-hist-close:hover { background: #ece2d6; }
        .fa-hist-close:active { transform: scale(.94); }
        .fa-hist-close svg { display: block; }
        .fa-hist-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: var(--fa-s2) var(--fa-s3) var(--fa-s3); display: flex; flex-direction: column; gap: var(--fa-s2); scrollbar-width: thin; }
        .fa-hist-empty { padding: var(--fa-s5) var(--fa-s4); text-align: center; color: var(--fa-ink-3); font-size: var(--fa-sm); }
        .fa-hist-item { display: flex; align-items: stretch; gap: var(--fa-s2); }
        .fa-hist-open {
            flex: 1 1 auto; min-width: 0; text-align: left; cursor: pointer; font-family: inherit;
            background: var(--fa-surface-2); border: 1px solid var(--fa-line); border-radius: var(--fa-r); padding: 10px 12px;
            transition: border-color var(--fa-dur) var(--fa-ease), background var(--fa-dur) var(--fa-ease);
        }
        .fa-hist-open:hover { border-color: var(--fa-accent-line); background: var(--fa-accent-soft); }
        .fa-hist-open[data-active="true"] { border-color: var(--fa-accent); background: var(--fa-accent-soft); }
        .fa-hist-title { display: block; font-size: var(--fa-md); font-weight: 700; color: var(--fa-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .fa-hist-meta { display: block; margin-top: 2px; font-size: var(--fa-2xs); color: var(--fa-ink-3); }
        .fa-hist-del {
            flex: 0 0 auto; width: 38px; border: 1px solid var(--fa-line); background: var(--fa-surface); border-radius: var(--fa-r);
            color: var(--fa-ink-3); cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: color var(--fa-dur) var(--fa-ease), border-color var(--fa-dur) var(--fa-ease), background var(--fa-dur) var(--fa-ease);
        }
        .fa-hist-del:hover { color: #b91c1c; border-color: #fecaca; background: #fef2f2; }
        .fa-hist-new {
            margin: 0 var(--fa-s3) var(--fa-s3); padding: 11px 12px; cursor: pointer; font-family: inherit;
            border: none; border-radius: var(--fa-r); background: var(--fa-accent); color: #fff; font-size: var(--fa-sm); font-weight: 800;
            box-shadow: var(--fa-shadow-accent);
        }
        .fa-hist-new:hover { background: var(--fa-accent-strong); }

        /* Confirmación de borrado en línea, dentro de la lista de chats (sin diálogos del navegador). */
        .fa-hist-confirm { width: 100%; display: flex; flex-direction: column; gap: var(--fa-s2); background: #fef2f2; border: 1px solid #fecaca; border-radius: var(--fa-r); padding: var(--fa-s3); }
        .fa-hist-confirm-text { margin: 0; font-size: var(--fa-sm); font-weight: 600; color: #991b1b; overflow-wrap: anywhere; }
        .fa-hist-confirm-actions { display: flex; gap: var(--fa-s2); }
        .fa-hist-confirm-actions .fa-btn { flex: 1 1 auto; padding: 8px 10px; }
        .fa-btn-danger { background: #dc2626; color: #fff; }
        .fa-btn-danger:hover { background: #b91c1c; }

        /* ───────── Panel principal ───────── */
        #furent-assistant-panel {
            position: fixed; right: var(--fa-s6); bottom: var(--fa-s6); z-index: 120;
            width: min(408px, calc(100vw - 2rem));
            height: min(660px, calc(100vh - 2rem));
            height: min(660px, calc(100dvh - 2rem));
            background: var(--fa-surface); border-radius: var(--fa-r-xl); overflow: hidden;
            display: flex; flex-direction: column;
            border: 1px solid var(--fa-line);
            box-shadow: var(--fa-shadow-2);
            animation: fa-pop var(--fa-dur-slow) var(--fa-ease-out);
            transition: width var(--fa-dur) var(--fa-ease-out);
        }
        #furent-assistant-panel[hidden] { display: none; }
        #furent-assistant-panel.fa-wide { width: min(768px, calc(100vw - 2rem)); }
        @keyframes fa-pop {
            from { opacity: 0; transform: translateY(16px) scale(.97); }
            to { opacity: 1; transform: none; }
        }

        .fa-header {
            position: relative; display: flex; align-items: center; gap: var(--fa-s3);
            padding: var(--fa-s3) var(--fa-s4);
            color: var(--fa-ink); background: var(--fa-surface); flex: 0 0 auto;
            border-bottom: 1px solid var(--fa-line);
        }
        .fa-avatar {
            width: 40px; height: 40px; border-radius: var(--fa-r); background: #fff;
            border: 1px solid var(--fa-line-2); overflow: hidden;
            display: flex; align-items: center; justify-content: center; flex: 0 0 auto;
        }
        .fa-avatar img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.34); display: block; }
        .fa-head-text { min-width: 0; }
        .fa-header h2 { margin: 0; font-size: var(--fa-lg); font-weight: 800; letter-spacing: -.01em; color: var(--fa-ink); }
        .fa-header p { margin: 1px 0 0; font-size: var(--fa-xs); font-weight: 500; color: var(--fa-ink-3); }
        .fa-close {
            margin-left: auto; background: var(--fa-surface-3); border: none; cursor: pointer;
            width: 36px; height: 36px; border-radius: var(--fa-r-sm); color: var(--fa-ink-2); display: flex; align-items: center; justify-content: center;
            transition: background var(--fa-dur) var(--fa-ease), transform var(--fa-dur-fast) var(--fa-ease);
        }
        .fa-close:hover { background: #ece2d6; }
        .fa-close:active { transform: scale(.94); }
        .fa-close:focus-visible { outline: 2px solid var(--fa-accent); outline-offset: 2px; }

        /* Cuerpo: [panel lateral | chat] */
        .fa-body { flex: 1 1 auto; min-height: 0; display: flex; }
        .fa-main { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; flex-direction: column; }

        .fa-side {
            flex: 0 0 auto; width: 300px; min-width: 0; display: flex; flex-direction: column;
            background: var(--fa-surface-2); border-right: 1px solid var(--fa-line);
        }
        .fa-side[hidden] { display: none; }
        .fa-side-head { display: flex; align-items: center; gap: var(--fa-s2); padding: var(--fa-s3) var(--fa-s4) var(--fa-s2); border-bottom: 1px solid var(--fa-line); }
        .fa-side-head h3 { margin: 0; flex: 1 1 auto; font-size: var(--fa-md); font-weight: 800; color: var(--fa-ink); }
        .fa-side-close { background: var(--fa-surface); border: 1px solid var(--fa-line-2); cursor: pointer; width: 28px; height: 28px; border-radius: var(--fa-r-xs); color: var(--fa-ink-2); display: inline-flex; align-items: center; justify-content: center; padding: 0; line-height: 0; transition: background var(--fa-dur) var(--fa-ease), transform var(--fa-dur-fast) var(--fa-ease); }
        .fa-side-close:hover { background: var(--fa-surface-3); }
        .fa-side-close:active { transform: scale(.94); }
        .fa-side-close svg { display: block; }
        .fa-side-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: var(--fa-s3) var(--fa-s4) var(--fa-s4); scrollbar-width: none; -ms-overflow-style: none; }
        .fa-side-body::-webkit-scrollbar { display: none; }
        .fa-view[hidden] { display: none; }

        .fa-messages {
            flex: 1 1 auto; min-height: 120px; overflow-y: auto; overflow-x: hidden; padding: var(--fa-s4);
            background: var(--fa-surface); display: flex; flex-direction: column; gap: var(--fa-s3);
            scroll-behavior: smooth; scrollbar-width: thin; scrollbar-color: var(--fa-line-2) transparent;
            /* Al llegar al final, el scroll no debe encadenarse con el de la página. */
            overscroll-behavior: contain;
        }
        .fa-messages::-webkit-scrollbar { width: 8px; }
        .fa-messages::-webkit-scrollbar-thumb { background: var(--fa-line-2); border-radius: var(--fa-r-pill); border: 2px solid transparent; background-clip: content-box; }

        .fa-row { display: flex; gap: var(--fa-s2); max-width: 100%; }
        .fa-row.user { justify-content: flex-end; }
        .fa-row.assistant { align-items: flex-end; }
        .fa-enter { animation: fa-rise var(--fa-dur-slow) var(--fa-ease-out) both; }
        @keyframes fa-rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

        /* Avatar junto a la burbuja del asistente (estilo de referencia) */
        .fa-avatar-sm { width: 28px; height: 28px; border-radius: var(--fa-r-pill); overflow: hidden; flex: 0 0 auto; background: var(--fa-accent-soft); border: 1px solid var(--fa-accent-line); }
        .fa-avatar-sm img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.34); display: block; }

        .fa-bubble {
            max-width: 84%; padding: 10px 13px; border-radius: var(--fa-r-lg);
            font-size: var(--fa-md); line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere;
        }
        .fa-bubble.assistant { background: var(--fa-surface-2); color: var(--fa-ink); border: 1px solid var(--fa-line); border-bottom-left-radius: var(--fa-r-xs); }
        .fa-bubble.user { background: linear-gradient(140deg, #e88a4c, #c2630f); color: #fff; border-bottom-right-radius: var(--fa-r-xs); }
        .fa-bubble.error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }

        /* Burbuja de nota (no es el asistente): aviso temporal al iniciar el chat. */
        .fa-note-row { display: flex; justify-content: center; }
        .fa-note {
            max-width: 92%; text-align: center; font-size: var(--fa-2xs); line-height: 1.5; color: var(--fa-ink-3);
            background: var(--fa-surface-2); border: 1px dashed var(--fa-line-2); border-radius: var(--fa-r);
            padding: var(--fa-s2) var(--fa-s3);
        }

        /* Aviso de chat cerrado (solo lectura): cubre el cierre por administrador y por vigencia. */
        .fa-closed-row { display: flex; justify-content: center; }
        .fa-closed {
            width: 100%; max-width: 94%; text-align: center;
            background: #fff7ed; border: 1px solid #fed7aa; border-radius: var(--fa-r-lg);
            padding: var(--fa-s4);
        }
        .fa-closed-ico {
            display: inline-flex; align-items: center; justify-content: center;
            width: 40px; height: 40px; border-radius: var(--fa-r-pill);
            background: #ffedd5; color: #b45309; margin-bottom: var(--fa-s2);
        }
        .fa-closed-title { margin: 0 0 3px; font-size: var(--fa-md); font-weight: 800; color: #9a3412; }
        .fa-closed-desc { margin: 0; font-size: var(--fa-sm); color: var(--fa-ink-2); line-height: 1.5; }
        .fa-closed-actions { display: flex; gap: var(--fa-s2); margin-top: var(--fa-s3); }
        .fa-closed-actions .fa-btn { flex: 1 1 auto; }
        /* Compositor bloqueado: el chat es solo de lectura. */
        .fa-composer-card.is-closed { opacity: .65; }
        /* Etiqueta de "Cerrado" en el historial. */
        .fa-hist-badge {
            display: inline-flex; align-items: center; gap: 4px; margin-top: 4px;
            font-size: var(--fa-2xs); font-weight: 800; color: #b45309;
            background: #fff7ed; border: 1px solid #fed7aa; border-radius: var(--fa-r-pill); padding: 1px 7px;
        }

        /* Markdown mínimo que compone assistant.js con nodos seguros */
        .fa-bubble.assistant > *:first-child { margin-top: 0; }
        .fa-bubble.assistant > *:last-child { margin-bottom: 0; }
        .fa-md-p { margin: 0 0 var(--fa-s2); }
        .fa-md-h { margin: var(--fa-s1) 0 var(--fa-s2); font-weight: 800; }
        .fa-bubble ul, .fa-bubble ol { margin: var(--fa-s1) 0 var(--fa-s2); padding-left: var(--fa-s4); }
        .fa-bubble li { margin: 3px 0; }
        .fa-bubble strong { font-weight: 800; color: var(--fa-ink); }
        .fa-md-code {
            background: rgba(36, 28, 21, .07); border-radius: 5px; padding: 1px 5px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: var(--fa-sm);
        }
        .fa-md-link { color: var(--fa-accent-strong); text-decoration: underline; text-underline-offset: 2px; overflow-wrap: anywhere; }
        /* Resaltado de datos importantes (==texto==). */
        .fa-hl { background: var(--fa-accent-soft); color: var(--fa-accent-strong); font-weight: 800; border-radius: 4px; padding: 0 4px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }

        /* Englobes (callouts): bloques para resaltar información importante. Sintaxis: > [!TIPO].
           Cada variante ajusta su color mediante variables locales (--fa-callout-*). */
        .fa-callout {
            --fa-callout-accent: #3b82f6;
            --fa-callout-bg: rgba(59, 130, 246, .09);
            --fa-callout-ink: #1d4ed8;
            display: flex; gap: var(--fa-s2); align-items: flex-start;
            margin: var(--fa-s2) 0; padding: var(--fa-s3);
            background: var(--fa-callout-bg);
            border: 1px solid var(--fa-callout-accent);
            border-left-width: 3px;
            border-radius: var(--fa-r);
        }
        .fa-callout-ico { flex: 0 0 auto; display: inline-flex; margin-top: 1px; color: var(--fa-callout-accent); }
        .fa-callout-ico svg { display: block; }
        .fa-callout-body { min-width: 0; flex: 1 1 auto; }
        .fa-callout-title { margin: 0 0 3px; font-size: var(--fa-2xs); font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--fa-callout-ink); }
        .fa-callout-content { font-size: var(--fa-sm); color: var(--fa-ink); }
        .fa-callout-content > *:first-child { margin-top: 0; }
        .fa-callout-content > *:last-child { margin-bottom: 0; }
        .fa-callout--info { --fa-callout-accent: #3b82f6; --fa-callout-bg: rgba(59, 130, 246, .09); --fa-callout-ink: #1d4ed8; }
        .fa-callout--tip { --fa-callout-accent: #d97706; --fa-callout-bg: rgba(217, 119, 6, .1); --fa-callout-ink: #b45309; }
        .fa-callout--precio { --fa-callout-accent: #16a34a; --fa-callout-bg: rgba(22, 163, 74, .1); --fa-callout-ink: #15803d; }
        .fa-callout--fecha { --fa-callout-accent: #7c3aed; --fa-callout-bg: rgba(124, 58, 237, .1); --fa-callout-ink: #6d28d9; }
        .fa-callout--alerta { --fa-callout-accent: #dc2626; --fa-callout-bg: rgba(220, 38, 38, .09); --fa-callout-ink: #b91c1c; }
        .fa-callout--exito { --fa-callout-accent: #0d9488; --fa-callout-bg: rgba(13, 148, 136, .1); --fa-callout-ink: #0f766e; }

        .fa-typing { display: inline-flex; gap: 4px; align-items: center; padding: 2px 0; }
        .fa-typing span { width: 6px; height: 6px; border-radius: var(--fa-r-pill); background: var(--fa-accent); opacity: .4; animation: fa-blink 1.2s infinite; }
        .fa-typing span:nth-child(2) { animation-delay: .18s; }
        .fa-typing span:nth-child(3) { animation-delay: .36s; }
        @keyframes fa-blink { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }
        /* Texto dinámico de "Typing Intelligence": qué está haciendo el asistente ahora. */
        .fa-typing-text {
            display: block; margin: 6px 0 0; font-size: var(--fa-xs); font-weight: 600;
            color: var(--fa-ink-3); letter-spacing: .01em;
        }
        .fa-typing-text[hidden] { display: none; }

        /* ───────── Tarjetas ───────── */
        .fa-card { background: var(--fa-surface); border: 1px solid var(--fa-line); border-radius: var(--fa-r-lg); overflow: hidden; width: 100%; box-shadow: var(--fa-shadow-1); }
        .fa-card-media { display: flex; gap: var(--fa-s3); padding: var(--fa-s3); align-items: center; }
        .fa-card-media img { width: 58px; height: 58px; border-radius: var(--fa-r-sm); object-fit: cover; background: var(--fa-surface-3); flex: 0 0 auto; }
        .fa-card-name { font-size: var(--fa-md); font-weight: 700; color: var(--fa-ink); margin: 0 0 2px; }
        .fa-card-meta { font-size: var(--fa-xs); color: var(--fa-ink-3); margin: 0; }
        .fa-card-price { font-size: var(--fa-md); font-weight: 800; color: var(--fa-accent-strong); white-space: nowrap; font-variant-numeric: tabular-nums; }
        .fa-card-actions { display: flex; gap: var(--fa-s2); padding: 0 var(--fa-s3) var(--fa-s3); }

        /* ───────── Botones ───────── */
        .fa-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            flex: 1 1 auto; border: none; cursor: pointer; border-radius: var(--fa-r-sm); padding: 10px 12px;
            font-size: var(--fa-sm); font-weight: 700; font-family: inherit; line-height: 1.1;
            transition: background var(--fa-dur) var(--fa-ease), transform var(--fa-dur-fast) var(--fa-ease), box-shadow var(--fa-dur) var(--fa-ease);
        }
        .fa-btn svg { flex: 0 0 auto; }
        .fa-btn:active { transform: scale(.97); }
        .fa-btn:focus-visible { outline: 2px solid var(--fa-accent); outline-offset: 2px; }
        .fa-btn:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }
        .fa-btn-primary { background: var(--fa-accent); color: #fff; box-shadow: var(--fa-shadow-accent); }
        .fa-btn-primary:hover { background: var(--fa-accent-strong); }
        .fa-btn-ghost { background: var(--fa-surface-3); color: var(--fa-ink-2); }
        .fa-btn-ghost:hover { background: #ece2d6; }
        .fa-btn-wa { background: #25d366; color: #fff; }
        .fa-btn-wa:hover { background: #1ebe5a; }

        /* ───────── Tarjeta de cotización (recibo) ───────── */
        .fa-quote { background: var(--fa-surface); border: 1px solid var(--fa-line); border-radius: var(--fa-r-lg); padding: var(--fa-s3); width: 100%; box-shadow: var(--fa-shadow-1); }
        .fa-quote-head { display: flex; align-items: center; gap: var(--fa-s2); margin-bottom: var(--fa-s3); }
        .fa-quote-ico { width: 28px; height: 28px; border-radius: var(--fa-r-xs); background: var(--fa-accent-soft); color: var(--fa-accent-strong); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
        .fa-quote h4 { margin: 0; font-size: var(--fa-md); font-weight: 800; color: var(--fa-ink); }
        .fa-quote-dates { margin: 1px 0 0; font-size: var(--fa-xs); color: var(--fa-ink-3); font-weight: 600; }
        .fa-quote-item { display: flex; justify-content: space-between; align-items: center; gap: var(--fa-s2); font-size: var(--fa-sm); padding: var(--fa-s2) 0; color: var(--fa-ink-2); }
        .fa-quote-item + .fa-quote-item { border-top: 1px solid var(--fa-line); }
        .fa-quote-thumb { width: 34px; height: 34px; border-radius: var(--fa-r-xs); object-fit: cover; background: var(--fa-surface-3); flex: 0 0 auto; }
        .fa-quote-item-main { display: flex; flex-direction: column; min-width: 0; flex: 1 1 auto; }
        .fa-quote-item-name { font-weight: 700; color: var(--fa-ink); font-size: var(--fa-sm); overflow: hidden; text-overflow: ellipsis; }
        .fa-quote-item-unit { font-size: var(--fa-2xs); color: var(--fa-ink-3); }
        .fa-quote-item-sub { font-weight: 800; white-space: nowrap; color: var(--fa-ink); font-variant-numeric: tabular-nums; flex: 0 0 auto; }
        .fa-quote-total { display: flex; justify-content: space-between; align-items: baseline; font-size: var(--fa-lg); font-weight: 800; color: var(--fa-ink); margin-top: var(--fa-s3); padding-top: var(--fa-s3); border-top: 1px dashed var(--fa-line-2); }
        .fa-quote-total span:last-child { font-variant-numeric: tabular-nums; }
        .fa-quote-note { font-size: var(--fa-2xs); color: var(--fa-ink-3); margin: var(--fa-s2) 0 0; line-height: 1.5; }
        .fa-quote-actions { display: flex; flex-wrap: wrap; gap: var(--fa-s2); margin-top: var(--fa-s3); }
        .fa-quote-actions .fa-btn, .fa-card-actions .fa-btn { flex: 1 1 auto; white-space: nowrap; }
        .fa-quote-stock {
            margin: var(--fa-s3) 0 0; padding: var(--fa-s2) var(--fa-s3); font-size: var(--fa-xs); color: #b45309;
            background: #fff7ed; border: 1px solid #fed7aa; border-radius: var(--fa-r-sm);
        }
        /* Tarjeta que invita a iniciar sesión o registrarse (visitantes). */
        .fa-auth-gate { border-color: var(--fa-accent-line); background: linear-gradient(180deg, var(--fa-accent-soft), var(--fa-surface) 62%); }

        /* ───────── Sugerencias (desplegable bajo el input) ───────── */
        /* Envuelven en varias filas: el texto completo siempre queda visible, sin recortes. */
        .fa-suggestions { display: flex; flex-wrap: wrap; gap: var(--fa-s2); padding: var(--fa-s2) 0 var(--fa-s3); overflow: visible; }
        .fa-suggestions[hidden] { display: none; }
        .fa-suggestions:not([hidden]) { animation: fa-rise var(--fa-dur) var(--fa-ease-out); }
        .fa-suggestions .fa-chip { flex: 0 1 auto; white-space: normal; text-align: left; line-height: 1.35; max-width: 100%; }
        .fa-chip {
            display: inline-flex; align-items: center; gap: 6px;
            border: 1px solid var(--fa-accent-line); background: var(--fa-surface); color: var(--fa-accent-strong); cursor: pointer;
            border-radius: var(--fa-r-pill); padding: 7px 12px; font-size: var(--fa-sm); font-weight: 600; font-family: inherit;
            transition: background var(--fa-dur) var(--fa-ease), border-color var(--fa-dur) var(--fa-ease), transform var(--fa-dur-fast) var(--fa-ease);
        }
        .fa-chip:hover { background: var(--fa-accent-soft); border-color: var(--fa-accent); }
        .fa-chip:active { transform: scale(.97); }
        .fa-chip:focus-visible { outline: 2px solid var(--fa-accent); outline-offset: 2px; }
        .fa-chip svg { color: var(--fa-accent); flex: 0 0 auto; }

        /* ───────── Menú del compositor (botón +): "Dropdown with Sections" ─────────
           Flota anclado por encima del compositor, alineado a la izquierda. Cada sección
           lleva un título y un separador; los ítems muestran icono, título y descripción. */
        .fa-quick {
            position: absolute; left: var(--fa-s4); bottom: calc(100% - var(--fa-s1)); z-index: 30;
            width: min(284px, calc(100% - var(--fa-s4) * 2));
            display: flex; flex-direction: column; gap: 1px; padding: 6px;
            background: var(--fa-surface); border: 1px solid var(--fa-line-2);
            border-radius: var(--fa-r-lg); box-shadow: var(--fa-shadow-2);
            transform-origin: bottom left;
        }
        .fa-quick[hidden] { display: none; }
        .fa-quick:not([hidden]) { animation: fa-menu-in var(--fa-dur) var(--fa-ease-out); }
        @keyframes fa-menu-in {
            from { opacity: 0; transform: translateY(6px) scale(.98); }
            to { opacity: 1; transform: none; }
        }
        .fa-menu-section { display: flex; flex-direction: column; gap: 1px; }
        .fa-menu-label {
            padding: 7px 10px 5px; color: var(--fa-ink-3);
            font-size: var(--fa-2xs); font-weight: 800; text-transform: uppercase; letter-spacing: .09em;
        }
        .fa-tool {
            display: flex; align-items: center; gap: 10px; width: 100%; cursor: pointer; text-align: left;
            border: none; background: transparent; color: var(--fa-ink);
            border-radius: var(--fa-r-sm); padding: 7px 10px; font-family: inherit;
            transition: background var(--fa-dur) var(--fa-ease), color var(--fa-dur) var(--fa-ease);
        }
        .fa-tool:hover { background: var(--fa-surface-2); }
        .fa-tool:active { transform: scale(.99); }
        .fa-tool:focus-visible { outline: 2px solid var(--fa-accent); outline-offset: -2px; }
        .fa-tool[aria-expanded="true"] { background: var(--fa-accent-soft); }
        .fa-menu-ico {
            flex: 0 0 auto; width: 30px; height: 30px; border-radius: var(--fa-r-xs);
            background: var(--fa-surface-2); color: var(--fa-ink-2);
            display: flex; align-items: center; justify-content: center;
            transition: background var(--fa-dur) var(--fa-ease), color var(--fa-dur) var(--fa-ease);
        }
        .fa-tool:hover .fa-menu-ico { color: var(--fa-accent-strong); }
        .fa-tool[aria-expanded="true"] .fa-menu-ico { background: var(--fa-accent-soft); color: var(--fa-accent-strong); }
        .fa-menu-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
        .fa-menu-title { font-size: var(--fa-sm); font-weight: 700; color: var(--fa-ink); line-height: 1.25; }
        .fa-tool[aria-expanded="true"] .fa-menu-title { color: var(--fa-accent-strong); }
        .fa-menu-desc { font-size: var(--fa-2xs); font-weight: 500; color: var(--fa-ink-3); line-height: 1.3; }
        .fa-menu-sep { height: 1px; margin: 5px 6px; background: var(--fa-line); }

        /* ───────── Compositor ─────────
           El campo de texto vive en su propia tarjeta, visualmente separada del historial
           (las sugerencias y el menú "+" quedan fuera, sobre el fondo del compositor). */
        /* Sin línea divisoria: la tarjeta del compositor es la que separa el input del chat. */
        .fa-composer { position: relative; flex: 0 0 auto; border-top: none; background: var(--fa-surface); padding: var(--fa-s2) var(--fa-s4) var(--fa-s3); }
        .fa-composer-card {
            display: flex; flex-direction: column; gap: var(--fa-s2);
            padding: 6px; border: 1px solid var(--fa-line-2); border-radius: 22px;
            background: var(--fa-surface); box-shadow: var(--fa-shadow-1);
            transition: border-color var(--fa-dur) var(--fa-ease), box-shadow var(--fa-dur) var(--fa-ease);
        }
        .fa-composer-card:focus-within { border-color: var(--fa-accent-line); box-shadow: 0 0 0 4px rgba(224, 122, 58, .10), var(--fa-shadow-1); }
        .fa-input-row { display: flex; gap: var(--fa-s2); align-items: flex-end; }
        .fa-plus {
            flex: 0 0 auto; width: 40px; height: 40px; border: none; cursor: pointer;
            border-radius: var(--fa-r-pill); background: var(--fa-surface-2); color: var(--fa-ink-2);
            display: flex; align-items: center; justify-content: center; padding: 0;
            transition: background var(--fa-dur) var(--fa-ease), color var(--fa-dur) var(--fa-ease), transform var(--fa-dur-fast) var(--fa-ease);
        }
        .fa-plus svg { display: block; }
        .fa-plus:hover { background: var(--fa-surface-3); }
        .fa-plus:active { transform: scale(.94); }
        .fa-plus:focus-visible { outline: 2px solid var(--fa-accent); outline-offset: 2px; }
        .fa-plus[aria-expanded="true"] { background: var(--fa-accent-soft); color: var(--fa-accent-strong); transform: rotate(45deg); }
        .fa-input {
            flex: 1 1 auto; resize: none; max-height: 120px; min-height: 40px;
            border: none; border-radius: var(--fa-r); padding: 10px 6px;
            font-size: var(--fa-md); font-family: inherit; line-height: 1.4; color: var(--fa-ink);
            background: transparent; outline: none; box-shadow: none;
            transition: border-color var(--fa-dur) var(--fa-ease), box-shadow var(--fa-dur) var(--fa-ease);
        }
        .fa-input::placeholder { color: var(--fa-ink-3); }
        .fa-input:focus { border: none; box-shadow: none; }
        .fa-send {
            flex: 0 0 auto; width: 40px; height: 40px; border: none; cursor: pointer; border-radius: var(--fa-r-pill);
            background: var(--fa-accent); color: #fff; display: flex; align-items: center; justify-content: center;
            box-shadow: var(--fa-shadow-accent);
            transition: background var(--fa-dur) var(--fa-ease), transform var(--fa-dur-fast) var(--fa-ease), box-shadow var(--fa-dur) var(--fa-ease);
        }
        .fa-send:hover { background: var(--fa-accent-strong); }
        .fa-send:active { transform: scale(.94); }
        .fa-send:focus-visible { outline: 3px solid rgba(224, 122, 58, .4); outline-offset: 2px; }
        .fa-send:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }

        /* ───────── Calendario (dentro del panel lateral) ───────── */
        .fa-calendar-host {
            display: block; width: 100%;
            padding: var(--fa-s3) var(--fa-s3) var(--fa-s2);
            background: var(--fa-surface); border: 1px solid var(--fa-line);
            border-radius: var(--fa-r-lg); box-shadow: var(--fa-shadow-1);
        }

        /* Hora del evento: control compacto e integrado con los atajos en la misma fila. */
        .fa-time { margin-top: var(--fa-s3); }
        .fa-time[hidden] { display: none; }
        .fa-time:not([hidden]) { animation: fa-rise var(--fa-dur) var(--fa-ease-out); }
        .fa-time-label { display: block; font-size: var(--fa-xs); font-weight: 800; color: var(--fa-ink-2); margin-bottom: 6px; }
        .fa-time-label .fa-field-req { color: var(--fa-accent-strong); }
        .fa-time-row { display: flex; align-items: center; flex-wrap: wrap; gap: var(--fa-s2); }
        .fa-time-input {
            width: auto; min-width: 112px; padding: 6px 10px; font-size: var(--fa-sm); font-family: inherit;
            color: var(--fa-ink); background: var(--fa-surface); border: 1px solid var(--fa-line-2);
            border-radius: var(--fa-r-pill); font-variant-numeric: tabular-nums; outline: none;
            transition: border-color var(--fa-dur) var(--fa-ease), box-shadow var(--fa-dur) var(--fa-ease);
        }
        .fa-time-input:focus { border-color: var(--fa-accent); box-shadow: 0 0 0 3px rgba(224, 122, 58, .14); }
        .fa-time-quick { display: flex; flex-wrap: wrap; gap: 6px; }
        .fa-time-quick .fa-chip { padding: 5px 10px; font-size: var(--fa-xs); }
        .fa-time-quick .fa-chip[aria-pressed="true"] { background: var(--fa-accent-soft); border-color: var(--fa-accent); color: var(--fa-accent-strong); }
        .fa-calendar-hint {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            margin: var(--fa-s3) 0 0; padding: 9px 12px; min-height: 38px;
            font-size: var(--fa-xs); font-weight: 600; color: var(--fa-ink-2); text-align: center;
            background: var(--fa-surface-2); border: 1px solid var(--fa-line); border-radius: var(--fa-r);
            transition: background var(--fa-dur) var(--fa-ease), border-color var(--fa-dur) var(--fa-ease),
                        color var(--fa-dur) var(--fa-ease);
        }
        .fa-calendar-hint[data-tone="warn"] { color: #b45309; background: #fff7ed; border-color: #fed7aa; }
        .fa-calendar-hint[data-tone="ok"] { color: var(--fa-accent-strong); background: var(--fa-accent-soft); border-color: var(--fa-accent-line); }
        .fa-calendar-actions { display: flex; gap: var(--fa-s2); align-items: stretch; margin-top: var(--fa-s3); }

        /* ───────── Formulario del evento (panel lateral) ───────── */
        .fa-form { display: flex; flex-direction: column; gap: var(--fa-s4); }
        .fa-form-desc { margin: 0; font-size: var(--fa-xs); color: var(--fa-ink-3); line-height: 1.5; }
        .fa-field { display: flex; flex-direction: column; gap: 6px; animation: fa-rise var(--fa-dur-slow) var(--fa-ease-out) backwards; }
        /* Mientras un desplegable está abierto, su campo se eleva por encima de los siguientes
           para que el menú no quede atrapado bajo el contexto de apilado de la animación. */
        .fa-field.is-open { position: relative; z-index: 30; }
        .fa-field-head { display: flex; align-items: center; gap: 6px; font-size: var(--fa-xs); font-weight: 800; color: var(--fa-ink-2); letter-spacing: .01em; }
        .fa-field-head > svg { color: var(--fa-accent-strong); flex: 0 0 auto; }
        .fa-field-req { color: var(--fa-accent-strong); }

        /* Control estilo Tailwind: caja redondeada, icono de prefijo, foco suave y caret propio. */
        .fa-control { position: relative; display: flex; align-items: center; }
        .fa-control input, .fa-control select, .fa-control textarea {
            width: 100%; border: 1px solid var(--fa-line-2); border-radius: var(--fa-r);
            padding: 11px 14px; font-size: var(--fa-md); font-family: inherit; line-height: 1.4;
            color: var(--fa-ink); background: var(--fa-surface); outline: none;
            transition: border-color var(--fa-dur) var(--fa-ease), box-shadow var(--fa-dur) var(--fa-ease), background var(--fa-dur) var(--fa-ease);
        }
        .fa-control textarea { resize: vertical; min-height: 84px; }
        .fa-control select { cursor: pointer; -webkit-appearance: none; -moz-appearance: none; appearance: none; padding-right: 38px; }
        .fa-control.has-ico input, .fa-control.has-ico select { padding-left: 40px; }
        .fa-control.has-ico.has-action input { padding-right: 42px; }
        .fa-control input::placeholder, .fa-control textarea::placeholder { color: var(--fa-ink-3); }
        .fa-control select:required:invalid { color: var(--fa-ink-3); }
        .fa-control input:hover, .fa-control select:hover, .fa-control textarea:hover { background: var(--fa-surface); }
        .fa-control:focus-within input, .fa-control:focus-within select, .fa-control:focus-within textarea,
        .fa-control input:focus, .fa-control select:focus, .fa-control textarea:focus {
            border-color: var(--fa-accent); background: var(--fa-surface); box-shadow: 0 0 0 4px rgba(224, 122, 58, .14);
        }
        .fa-control-ico {
            position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
            display: flex; align-items: center; color: var(--fa-ink-3); pointer-events: none;
            transition: color var(--fa-dur) var(--fa-ease);
        }
        .fa-control-ico svg { display: block; }
        .fa-control:focus-within > .fa-control-ico { color: var(--fa-accent-strong); }
        .fa-control-caret {
            position: absolute; right: 13px; top: 50%; transform: translateY(-50%);
            display: flex; align-items: center; color: var(--fa-ink-3); pointer-events: none;
            transition: color var(--fa-dur) var(--fa-ease), transform var(--fa-dur) var(--fa-ease);
        }
        .fa-control-caret svg { display: block; }
        .fa-control:focus-within > .fa-control-caret { color: var(--fa-accent-strong); transform: translateY(-50%) rotate(180deg); }
        .fa-control-action {
            position: absolute; right: 9px; top: 50%; transform: translateY(-50%);
            width: 28px; height: 28px; padding: 0; border: none; border-radius: var(--fa-r-xs); cursor: pointer;
            background: transparent; color: var(--fa-ink-3); display: inline-flex; align-items: center; justify-content: center;
            transition: background var(--fa-dur) var(--fa-ease), color var(--fa-dur) var(--fa-ease);
        }
        .fa-control-action:hover { background: var(--fa-accent-soft); color: var(--fa-accent-strong); }
        .fa-control-action svg { display: block; }
        /* Quitar los "spinners" del input numérico. */
        .fa-control input[type="number"]::-webkit-outer-spin-button,
        .fa-control input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .fa-control input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
        .fa-form-error { color: #b91c1c; font-size: var(--fa-xs); font-weight: 700; }

        /* Checklist de los datos del alquiler (vista de detalles del checkout). */
        .fa-checklist { display: flex; flex-wrap: wrap; gap: 6px; }
        .fa-check-item {
            display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: var(--fa-r-pill);
            font-size: var(--fa-2xs); font-weight: 700; color: var(--fa-ink-3);
            background: var(--fa-surface-2); border: 1px solid var(--fa-line-2);
        }
        .fa-check-item svg { color: var(--fa-ink-3); flex: 0 0 auto; }
        .fa-check-item.done { color: var(--fa-accent-strong); background: var(--fa-accent-soft); border-color: var(--fa-accent-line); }
        .fa-check-item.done svg { color: var(--fa-accent-strong); }

        /* ───────── Desplegable propio del formulario (trigger + menú con iconos y color) ───────── */
        .fa-select {
            width: 100%; display: flex; align-items: center; gap: 10px; cursor: pointer; font-family: inherit;
            border: 1px solid var(--fa-line-2); border-radius: var(--fa-r);
            padding: 11px 12px; font-size: var(--fa-md); line-height: 1.4; color: var(--fa-ink);
            background: var(--fa-surface); text-align: left;
            transition: border-color var(--fa-dur) var(--fa-ease), box-shadow var(--fa-dur) var(--fa-ease), background var(--fa-dur) var(--fa-ease);
        }
        .fa-select:focus-visible { outline: none; }
        .fa-select.is-open,
        .fa-control:focus-within > .fa-select { border-color: var(--fa-accent); box-shadow: 0 0 0 4px rgba(224, 122, 58, .14); }
        .fa-select-ico { flex: 0 0 auto; display: inline-flex; color: var(--fa-ink-3); }
        .fa-select-ico svg, .fa-select-caret svg, .fa-select-check svg { display: block; }
        .fa-select-label { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--fa-ink-3); }
        .fa-control.has-value .fa-select-label, .fa-select.is-open .fa-select-label { color: var(--fa-ink); font-weight: 600; }
        .fa-select-caret { flex: 0 0 auto; display: inline-flex; color: var(--fa-ink-3); transition: transform var(--fa-dur) var(--fa-ease), color var(--fa-dur) var(--fa-ease); }
        .fa-select.is-open .fa-select-caret { transform: rotate(180deg); color: var(--fa-accent-strong); }

        .fa-select-menu {
            position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 40;
            margin: 0; padding: 6px; list-style: none;
            background: var(--fa-surface); border: 1px solid var(--fa-line); border-radius: var(--fa-r);
            box-shadow: 0 18px 40px -16px rgba(36, 28, 21, .45);
            overflow-y: auto; scrollbar-width: thin;
            animation: fa-pop var(--fa-dur-fast) var(--fa-ease-out);
        }
        .fa-select-menu[hidden] { display: none; }
        .fa-select-opt {
            display: flex; align-items: center; gap: 10px; cursor: pointer;
            padding: 8px 9px; border-radius: var(--fa-r-xs); color: var(--fa-ink); font-size: var(--fa-md);
            transition: background var(--fa-dur-fast) var(--fa-ease);
        }
        .fa-select-opt:hover, .fa-select-opt.is-active { background: var(--fa-surface-3); }
        .fa-select-opt[aria-selected="true"] { background: var(--fa-accent-soft); color: var(--fa-accent-strong); font-weight: 700; }
        .fa-select-opt-text { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .fa-select-opt-ico {
            flex: 0 0 auto; width: 26px; height: 26px; border-radius: 8px;
            display: inline-flex; align-items: center; justify-content: center;
            color: var(--fa-ink-2); background: var(--fa-surface-3);
        }
        .fa-select-check { flex: 0 0 auto; display: none; color: var(--fa-accent-strong); }
        .fa-select-opt[aria-selected="true"] .fa-select-check { display: inline-flex; }
        /* Tono de color por opción (icono del disparador y de la lista). */
        .fa-select-ico[data-tone="rose"], .fa-select-opt-ico[data-tone="rose"] { color: #e11d48; }
        .fa-select-ico[data-tone="amber"], .fa-select-opt-ico[data-tone="amber"] { color: #d97706; }
        .fa-select-ico[data-tone="blue"], .fa-select-opt-ico[data-tone="blue"] { color: #2563eb; }
        .fa-select-ico[data-tone="violet"], .fa-select-opt-ico[data-tone="violet"] { color: #7c3aed; }
        .fa-select-ico[data-tone="pink"], .fa-select-opt-ico[data-tone="pink"] { color: #db2777; }
        .fa-select-ico[data-tone="green"], .fa-select-opt-ico[data-tone="green"] { color: #16a34a; }
        .fa-select-ico[data-tone="slate"], .fa-select-opt-ico[data-tone="slate"] { color: #64748b; }
        .fa-select-opt-ico[data-tone="rose"] { background: rgba(225, 29, 72, .12); }
        .fa-select-opt-ico[data-tone="amber"] { background: rgba(217, 119, 6, .14); }
        .fa-select-opt-ico[data-tone="blue"] { background: rgba(37, 99, 235, .12); }
        .fa-select-opt-ico[data-tone="violet"] { background: rgba(124, 58, 237, .12); }
        .fa-select-opt-ico[data-tone="pink"] { background: rgba(219, 39, 119, .12); }
        .fa-select-opt-ico[data-tone="green"] { background: rgba(22, 163, 74, .12); }
        .fa-select-opt-ico[data-tone="slate"] { background: rgba(100, 116, 139, .14); }

        /* Botón de solo icono (p. ej. "Limpiar"). */
        .fa-icon-btn {
            flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center;
            width: 46px; height: 46px; padding: 0; cursor: pointer;
            border: 1px solid var(--fa-line-2); border-radius: var(--fa-r);
            background: var(--fa-surface); color: var(--fa-ink-2);
            transition: background var(--fa-dur) var(--fa-ease), border-color var(--fa-dur) var(--fa-ease), color var(--fa-dur) var(--fa-ease), transform var(--fa-dur-fast) var(--fa-ease);
        }
        .fa-icon-btn:hover { background: var(--fa-accent-soft); border-color: var(--fa-accent-line); color: var(--fa-accent-strong); }
        .fa-icon-btn:active { transform: scale(.94); }
        .fa-icon-btn:focus-visible { outline: 2px solid var(--fa-accent); outline-offset: 2px; }
        .fa-icon-btn svg { display: block; }

        /* Tooltip ligero para botones de solo icono (aparece al pasar el cursor o enfocar). */
        .fa-tip { position: relative; }
        .fa-tip::after {
            content: attr(data-tip); position: absolute; bottom: calc(100% + 9px); left: 50%;
            transform: translateX(-50%) translateY(4px); z-index: 30;
            background: #241c15; color: #fff; font-size: var(--fa-2xs); font-weight: 700; letter-spacing: .01em;
            padding: 5px 9px; border-radius: 7px; white-space: nowrap; pointer-events: none;
            box-shadow: 0 8px 20px -8px rgba(0, 0, 0, .5);
            opacity: 0; transition: opacity var(--fa-dur) var(--fa-ease), transform var(--fa-dur) var(--fa-ease);
        }
        .fa-tip::before {
            content: ''; position: absolute; bottom: calc(100% + 4px); left: 50%;
            transform: translateX(-50%) translateY(4px); z-index: 30;
            border: 5px solid transparent; border-top-color: #241c15; pointer-events: none;
            opacity: 0; transition: opacity var(--fa-dur) var(--fa-ease), transform var(--fa-dur) var(--fa-ease);
        }
        .fa-tip:hover::after, .fa-tip:focus-visible::after,
        .fa-tip:hover::before, .fa-tip:focus-visible::before {
            opacity: 1; transform: translateX(-50%) translateY(0);
        }

        /* ───────── DateRangePicker / RangeCalendar (estilo HeroUI) ─────────
           Réplica del componente de HeroUI: un campo con dos segmentos (inicio y fin)
           unidos por un separador y un disparador de calendario; el popover contiene el
           RangeCalendar con banda de selección continua y navegación animada entre meses. */

        /* Disparador del campo de fechas del formulario (dentro de .fa-control). */
        .fa-drp {
            position: relative; width: 100%; display: flex; align-items: center; gap: 8px;
            cursor: pointer; font-family: inherit; text-align: left;
            border: 1px solid var(--fa-line-2); border-radius: var(--fa-r);
            padding: 10px 40px 10px 13px; font-size: var(--fa-md); line-height: 1.4; color: var(--fa-ink);
            background: var(--fa-surface);
            transition: border-color var(--fa-dur) var(--fa-ease), box-shadow var(--fa-dur) var(--fa-ease),
                        background var(--fa-dur) var(--fa-ease), padding-right var(--fa-dur) var(--fa-ease);
        }
        .fa-control.has-clear > .fa-drp { padding-right: 66px; }
        .fa-drp:focus-visible { outline: none; }
        .fa-drp[aria-expanded="true"],
        .fa-control:focus-within > .fa-drp { border-color: var(--fa-accent); box-shadow: 0 0 0 4px rgba(224, 122, 58, .14); }
        .fa-drp-seg {
            flex: 1 1 0; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            font-variant-numeric: tabular-nums; font-weight: 600;
            transition: color var(--fa-dur) var(--fa-ease), transform var(--fa-dur) var(--fa-ease-out);
        }
        .fa-drp-seg[data-slot="end"] { text-align: right; }
        .fa-drp-seg[data-empty="true"] { color: var(--fa-ink-3); font-weight: 500; }
        .fa-drp.is-filled .fa-drp-seg { animation: fa-drp-swap var(--fa-dur) var(--fa-ease-out); }
        @keyframes fa-drp-swap { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
        .fa-drp-sep {
            flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center;
            color: var(--fa-ink-3); transition: color var(--fa-dur) var(--fa-ease), transform var(--fa-dur) var(--fa-ease-out);
        }
        .fa-drp-sep svg { display: block; }
        .fa-drp[aria-expanded="true"] .fa-drp-sep { color: var(--fa-accent-strong); transform: scaleX(1.1); }
        .fa-drp-ico {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            display: inline-flex; color: var(--fa-ink-3); pointer-events: none;
            transition: color var(--fa-dur) var(--fa-ease), transform var(--fa-dur) var(--fa-ease-out);
        }
        .fa-drp-ico svg { display: block; }
        .fa-drp:hover .fa-drp-ico,
        .fa-drp[aria-expanded="true"] .fa-drp-ico,
        .fa-control:focus-within > .fa-drp .fa-drp-ico { color: var(--fa-accent-strong); }
        .fa-drp[aria-expanded="true"] .fa-drp-ico { transform: translateY(-50%) scale(1.12); }
        /* Botón "Limpiar" del campo: aparece solo cuando hay un rango elegido. */
        .fa-drp-clear {
            position: absolute; right: 38px; top: 50%; transform: translateY(-50%) scale(.7);
            width: 26px; height: 26px; padding: 0; border: none; border-radius: var(--fa-r-xs); cursor: pointer;
            background: transparent; color: var(--fa-ink-3); display: inline-flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none;
            transition: background var(--fa-dur) var(--fa-ease), color var(--fa-dur) var(--fa-ease),
                        opacity var(--fa-dur) var(--fa-ease), transform var(--fa-dur) var(--fa-ease-out);
        }
        .fa-control.has-clear > .fa-drp-clear { opacity: 1; pointer-events: auto; transform: translateY(-50%) scale(1); }
        .fa-drp-clear:hover { background: var(--fa-accent-soft); color: var(--fa-accent-strong); }
        .fa-drp-clear:active { transform: translateY(-50%) scale(.9); }
        .fa-drp-clear svg { display: block; }

        /* Popover del calendario: se anexa al panel para heredar los tokens --fa-* y el modo oscuro. */
        .fa-drp-pop {
            position: absolute; z-index: 130; width: 304px; max-width: calc(100% - 24px);
            padding: 14px; box-sizing: border-box;
            background: var(--fa-surface); border: 1px solid var(--fa-line);
            border-radius: var(--fa-r-xl); box-shadow: var(--fa-shadow-2);
            transform-origin: top center;
        }
        .fa-drp-pop[hidden] { display: none; }
        .fa-drp-pop:not([hidden]) { animation: fa-drp-in var(--fa-dur) var(--fa-ease-out); }
        @keyframes fa-drp-in {
            from { opacity: 0; transform: translateY(-7px) scale(.965); }
            to { opacity: 1; transform: none; }
        }
        /* Pie del popover: resumen de días + limpiar. */
        .fa-drp-foot {
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
            margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--fa-line);
        }
        .fa-drp-foot-hint { font-size: var(--fa-xs); font-weight: 600; color: var(--fa-ink-3); min-width: 0; }
        .fa-drp-foot-hint strong { color: var(--fa-accent-strong); font-weight: 800; }
        .fa-drp-foot-clear {
            flex: 0 0 auto; border: none; background: transparent; cursor: pointer; font-family: inherit;
            font-size: var(--fa-2xs); font-weight: 800; text-transform: uppercase; letter-spacing: .05em;
            color: var(--fa-accent-strong); padding: 4px 8px; border-radius: var(--fa-r-xs);
            transition: background var(--fa-dur) var(--fa-ease), opacity var(--fa-dur) var(--fa-ease);
        }
        .fa-drp-foot-clear:hover { background: var(--fa-accent-soft); }
        .fa-drp-foot-clear[hidden] { display: none; }

        /* ── RangeCalendar ── */
        .fa-rcal { width: 100%; font-family: var(--fa-font); -webkit-user-select: none; user-select: none; }
        .fa-rcal-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 6px; }
        .fa-rcal-month {
            flex: 1 1 auto; text-align: center; font-size: var(--fa-md); font-weight: 800; color: var(--fa-ink);
            text-transform: capitalize; letter-spacing: .01em;
        }
        .fa-rcal-navbtn {
            flex: 0 0 auto; width: 32px; height: 32px; padding: 0; border: none; cursor: pointer;
            border-radius: var(--fa-r-pill); background: transparent; color: var(--fa-ink-2);
            display: inline-flex; align-items: center; justify-content: center;
            transition: background var(--fa-dur) var(--fa-ease), color var(--fa-dur) var(--fa-ease), transform var(--fa-dur-fast) var(--fa-ease);
        }
        .fa-rcal-navbtn svg { display: block; }
        .fa-rcal-navbtn:hover:not(:disabled) { background: var(--fa-surface-3); color: var(--fa-accent-strong); }
        .fa-rcal-navbtn:active:not(:disabled) { transform: scale(.9); }
        .fa-rcal-navbtn:disabled { opacity: .3; cursor: default; }
        .fa-rcal-navbtn:focus-visible { outline: 2px solid var(--fa-accent); outline-offset: 2px; }

        .fa-rcal-viewport { overflow: hidden; }
        .fa-rcal-grid { display: flex; flex-direction: column; }
        .fa-rcal-grid.slide-next { animation: fa-rcal-next var(--fa-dur) var(--fa-ease-out); }
        .fa-rcal-grid.slide-prev { animation: fa-rcal-prev var(--fa-dur) var(--fa-ease-out); }
        @keyframes fa-rcal-next { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: none; } }
        @keyframes fa-rcal-prev { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: none; } }

        .fa-rcal-week, .fa-rcal-row { display: grid; grid-template-columns: repeat(7, 1fr); }
        .fa-rcal-wd {
            text-align: center; font-size: var(--fa-2xs); font-weight: 800; color: var(--fa-ink-3);
            text-transform: uppercase; letter-spacing: .05em; padding: 4px 0 8px;
        }
        .fa-rcal-day {
            position: relative; height: 38px; padding: 0; border: none; background: transparent; cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-family: inherit;
        }
        /* Banda continua del rango: une los extremos por detrás de los números. */
        .fa-rcal-day::before {
            content: ''; position: absolute; top: 5px; bottom: 5px; left: -1px; right: -1px;
            background: transparent; z-index: 0;
            transition: background var(--fa-dur-fast) var(--fa-ease);
        }
        .fa-rcal-day[data-in-selection="true"]::before { background: var(--fa-accent-soft); }
        .fa-rcal-day[data-selection-start="true"]::before {
            left: 50%; border-top-left-radius: var(--fa-r-pill); border-bottom-left-radius: var(--fa-r-pill);
        }
        .fa-rcal-day[data-selection-end="true"]::before {
            right: 50%; border-top-right-radius: var(--fa-r-pill); border-bottom-right-radius: var(--fa-r-pill);
        }
        .fa-rcal-day-num {
            position: relative; z-index: 1; width: 32px; height: 32px;
            display: inline-flex; align-items: center; justify-content: center;
            border-radius: var(--fa-r-pill); font-size: var(--fa-sm); font-weight: 600; color: var(--fa-ink);
            font-variant-numeric: tabular-nums;
            transition: background var(--fa-dur-fast) var(--fa-ease), color var(--fa-dur-fast) var(--fa-ease),
                        box-shadow var(--fa-dur-fast) var(--fa-ease), transform var(--fa-dur-fast) var(--fa-ease);
        }
        .fa-rcal-day:hover:not(:disabled) .fa-rcal-day-num { background: var(--fa-surface-3); }
        .fa-rcal-day:active:not(:disabled) .fa-rcal-day-num { transform: scale(.92); }
        .fa-rcal-day:focus-visible { outline: none; }
        .fa-rcal-day:focus-visible .fa-rcal-day-num { outline: 2px solid var(--fa-accent); outline-offset: 1px; }
        .fa-rcal-day[data-outside="true"] .fa-rcal-day-num { opacity: .4; }
        .fa-rcal-day[data-today="true"] .fa-rcal-day-num { box-shadow: inset 0 0 0 1.5px var(--fa-accent); }
        .fa-rcal-day[data-in-selection="true"] .fa-rcal-day-num { color: var(--fa-accent-strong); font-weight: 700; }
        .fa-rcal-day[data-in-selection="true"]:hover:not(:disabled) .fa-rcal-day-num { background: var(--fa-accent-line); }
        .fa-rcal-day[data-selected="true"] .fa-rcal-day-num {
            background: var(--fa-accent); color: #fff; font-weight: 800;
            box-shadow: 0 4px 10px -3px rgba(194, 99, 15, .7);
        }
        .fa-rcal-day[data-selected="true"]:hover .fa-rcal-day-num { background: var(--fa-accent-strong); }
        .fa-rcal-day:disabled { cursor: default; }
        .fa-rcal-day[data-disabled="true"] .fa-rcal-day-num { color: var(--fa-ink-3); opacity: .45; }
        .fa-rcal-day[data-unavailable="true"] .fa-rcal-day-num { color: #b91c1c; opacity: 1; }
        .fa-rcal-day[data-unavailable="true"] .fa-rcal-day-num::after {
            content: ''; position: absolute; left: 7px; right: 7px; top: 50%; height: 1.5px;
            background: currentColor; border-radius: 2px; transform: translateY(-50%);
        }

        /* Oscuro: el popover hereda los tokens del panel; ajustamos los tonos propios. */
        .dark .fa-rcal-day[data-in-selection="true"]::before { background: #3a2a1c; }
        .dark .fa-rcal-day[data-in-selection="true"] .fa-rcal-day-num { color: #f0b483; }
        .dark .fa-rcal-day[data-in-selection="true"]:hover:not(:disabled) .fa-rcal-day-num { background: #4a3524; }
        .dark .fa-rcal-day[data-unavailable="true"] .fa-rcal-day-num { color: #fca5a5; }
        .dark .fa-rcal-day:hover:not(:disabled) .fa-rcal-day-num { background: #352c24; }
        .dark .fa-drp-foot-clear:hover { background: #3a2a1c; }
        .dark .fa-drp-clear:hover { background: #3a2a1c; color: #f0b483; }

        /* ───────── Bolsa y seguimiento (panel lateral) ───────── */
        .fa-bag-item { display: flex; align-items: center; gap: var(--fa-s2); padding: var(--fa-s2) 0; border-bottom: 1px solid var(--fa-line); }
        .fa-bag-item:last-of-type { border-bottom: none; }
        .fa-bag-thumb { width: 42px; height: 42px; border-radius: var(--fa-r-xs); object-fit: cover; background: var(--fa-surface-3); flex: 0 0 auto; }
        .fa-bag-main { flex: 1 1 auto; min-width: 0; }
        .fa-bag-name { margin: 0; font-size: var(--fa-sm); font-weight: 700; color: var(--fa-ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .fa-bag-price { margin: 0; font-size: var(--fa-2xs); color: var(--fa-ink-3); }
        .fa-qty { display: inline-flex; align-items: center; gap: 2px; flex: 0 0 auto; }
        .fa-qty button { width: 26px; height: 26px; border: 1px solid var(--fa-line-2); background: var(--fa-surface); border-radius: var(--fa-r-xs); cursor: pointer; color: var(--fa-ink-2); font-size: 15px; line-height: 1; }
        .fa-qty button:hover { background: var(--fa-surface-3); }
        .fa-qty span { min-width: 22px; text-align: center; font-size: var(--fa-sm); font-weight: 800; color: var(--fa-ink); }
        .fa-bag-total { display: flex; justify-content: space-between; align-items: baseline; margin-top: var(--fa-s3); padding-top: var(--fa-s3); border-top: 1px dashed var(--fa-line-2); font-weight: 800; color: var(--fa-ink); }
        .fa-bag-empty { text-align: center; padding: var(--fa-s5) 0; color: var(--fa-ink-3); font-size: var(--fa-sm); }
        .fa-panel-title { margin: 0 0 var(--fa-s2); font-size: var(--fa-md); font-weight: 800; color: var(--fa-ink); }
        .fa-panel-sub { margin: 0 0 var(--fa-s3); font-size: var(--fa-xs); color: var(--fa-ink-3); line-height: 1.5; }
        .fa-reco-budget { margin: var(--fa-s2) 0 0; font-size: var(--fa-xs); color: var(--fa-ink-2); }
        .fa-timeline { display: flex; flex-direction: column; gap: 0; margin: var(--fa-s2) 0 0; }
        .fa-step { display: flex; gap: var(--fa-s2); align-items: flex-start; }
        .fa-step-dot { width: 12px; height: 12px; border-radius: var(--fa-r-pill); border: 2px solid var(--fa-line-2); background: var(--fa-surface); flex: 0 0 auto; margin-top: 3px; }
        .fa-step.done .fa-step-dot { border-color: var(--fa-accent); background: var(--fa-accent); }
        .fa-step.current .fa-step-dot { box-shadow: 0 0 0 4px var(--fa-accent-soft); }
        .fa-step-label { font-size: var(--fa-xs); font-weight: 700; color: var(--fa-ink-3); text-transform: capitalize; }
        .fa-step.done .fa-step-label { color: var(--fa-ink); }
        .fa-step:not(:last-child) .fa-step-line { width: 2px; flex: 1 1 auto; background: var(--fa-line-2); }
        .fa-step-col { display: flex; flex-direction: column; align-items: center; }

        /* ───────── Vistas de descubrimiento, plan y cuenta ───────── */
        .fa-list { display: flex; flex-direction: column; gap: var(--fa-s2); }
        .fa-item { display: flex; gap: var(--fa-s2); padding: var(--fa-s2); border: 1px solid var(--fa-line-2); border-radius: var(--fa-r-sm); background: var(--fa-surface); }
        .fa-item-img { width: 46px; height: 46px; border-radius: var(--fa-r-xs); object-fit: cover; background: var(--fa-surface-3); flex: 0 0 auto; }
        .fa-item-main { flex: 1 1 auto; min-width: 0; }
        .fa-item-name { margin: 0; font-size: var(--fa-sm); font-weight: 800; color: var(--fa-ink); }
        .fa-item-meta { margin: 2px 0 0; font-size: var(--fa-2xs); color: var(--fa-ink-3); }
        .fa-item-price { font-size: var(--fa-sm); font-weight: 800; color: var(--fa-ink); white-space: nowrap; }
        .fa-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
        .fa-tag { font-size: var(--fa-2xs); font-weight: 700; padding: 2px 7px; border-radius: var(--fa-r-pill); background: var(--fa-surface-3); color: var(--fa-ink-2); }
        .fa-tag.is-good { background: var(--fa-accent-soft); color: var(--fa-accent); }
        .fa-stars { color: #d98324; font-size: var(--fa-sm); letter-spacing: 1px; }
        .fa-cmp-attr { display: flex; justify-content: space-between; gap: var(--fa-s2); font-size: var(--fa-2xs); color: var(--fa-ink-2); padding: 2px 0; }
        .fa-cmp-attr span:first-child { color: var(--fa-ink-3); font-weight: 600; }
        .fa-insp-img { width: 100%; border-radius: var(--fa-r-sm); aspect-ratio: 4 / 3; object-fit: cover; background: var(--fa-surface-3); }
        .fa-plan-list { margin: 0; padding-left: 16px; font-size: var(--fa-xs); color: var(--fa-ink-2); }
        .fa-plan-list li { margin-bottom: 3px; }
        .fa-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: var(--fa-s2); }
        .fa-mesa { border: 1px solid var(--fa-line-2); border-radius: var(--fa-r-sm); padding: var(--fa-s2); text-align: center; background: var(--fa-surface); }
        .fa-mesa-num { font-size: var(--fa-sm); font-weight: 800; color: var(--fa-ink); }
        .fa-mesa-cap { font-size: var(--fa-2xs); color: var(--fa-ink-3); }
