    <!-- Tailwind Plus Elements for Modals -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindplus/elements@1" type="module"></script>
    <!-- Theme detection (sync with public site localStorage) -->
    <script>
        (function() {
            if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();

        // Global UI Notification System
        window.showToast = function(optionsOrMessage, typeOverride = 'success', durationOverride = 5000) {
            const container = document.getElementById('toast-container');
            if (!container) {
                console.warn('Toast container not found');
                return;
            }
            let config = { message: '', title: '', type: typeOverride, duration: durationOverride };
            if (typeof optionsOrMessage === 'object' && optionsOrMessage !== null) {
                config = { ...config, ...optionsOrMessage };
            } else {
                config.message = optionsOrMessage;
            }
            const message = String(config.message || '');
            const title = String(config.title || '');
            const type = config.type || 'success';
            const duration = config.duration || 5000;
            const id = 'toast-' + Math.random().toString(36).substr(2, 9);
            let iconBoxClass = 'text-green-600 bg-green-50';
            let iconSvg = `<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>`;
            if (type === 'error' || type === 'danger') {
                iconBoxClass = 'text-red-600 bg-red-50';
                iconSvg = `<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>`;
            } else if (type === 'warning') {
                iconBoxClass = 'text-amber-600 bg-amber-50';
                iconSvg = `<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>`;
            }
            const toastHtml = `
                <div id="${id}" class="pointer-events-auto flex items-center w-full max-w-sm p-4 text-surface-600 bg-white/95 dark:bg-surface-800/95 backdrop-blur-md rounded-xl shadow-2xl border border-surface-200 dark:border-surface-700 transition-all duration-300" role="alert">
                    <div class="inline-flex items-center justify-center shrink-0 w-8 h-8 ${iconBoxClass} rounded-lg">${iconSvg}</div>
                    <div class="ms-3 text-sm font-bold text-surface-900 dark:text-white">${title ? `<span class="opacity-50 font-medium block text-[10px] uppercase mb-0.5">${title}</span>` : ''}${message}</div>
                    <button type="button" onclick="closeToast('${id}')" class="ms-auto -mx-1.5 -my-1.5 text-surface-400 hover:text-surface-900 dark:hover:text-white rounded-lg p-1.5 hover:bg-surface-100 inline-flex items-center justify-center"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></button>
                </div>
            `;
            container.insertAdjacentHTML('afterbegin', toastHtml);
            setTimeout(() => closeToast(id), duration);
        };
        window.closeToast = function(id) {
            const toast = document.getElementById(id);
            if (toast) { toast.style.opacity = '0'; toast.style.transform = 'translateX(20px)'; setTimeout(() => toast.remove(), 300); }
        };
        window.showModal = function(config) {
            const dialog = document.getElementById('global-dialog');
            const panel = dialog.querySelector('el-dialog-panel');
            const titleEl = document.getElementById('modal-title');
            const msgContainer = document.getElementById('modal-msg-container');
            const messageEl = document.getElementById('modal-message');
            const htmlEl = document.getElementById('modal-html');
            const iconBox = document.getElementById('modal-icon-box');
            const iconSvg = document.getElementById('modal-icon-svg');
            const confirmBtn = document.getElementById('modal-confirm-btn');
            const cancelBtn = document.getElementById('modal-cancel-btn');
            
            if (!dialog || !titleEl) return;
            titleEl.textContent = config.title || 'Aviso';
            confirmBtn.textContent = config.confirmText || 'Entendido';
            
            // Re-apply animation class to ensure it plays
            dialog.classList.remove('animate-modal-out');
            dialog.classList.add('open:animate-modal-in');
            
            // Handle HTML or Text
            if (config.html) {
                htmlEl.innerHTML = config.html;
                htmlEl.classList.remove('hidden');
                msgContainer.classList.add('hidden');
                iconBox.classList.add('hidden');
                panel.classList.remove('sm:max-w-md');
                panel.classList.add('sm:max-w-xl');
            } else {
                messageEl.textContent = config.message || '';
                htmlEl.classList.add('hidden');
                msgContainer.classList.remove('hidden');
                iconBox.classList.remove('hidden');
                panel.classList.remove('sm:max-w-2xl');
                panel.classList.add('sm:max-w-md');
            }

            if (config.cancelText) {
                cancelBtn.textContent = config.cancelText;
                cancelBtn.classList.remove('hidden');
                confirmBtn.classList.replace('flex-1', 'w-full');
            } else {
                cancelBtn.classList.add('hidden');
                confirmBtn.classList.replace('w-full', 'flex-1');
            }

            if (config.type === 'error' || config.type === 'danger') {
                iconBox.className = "mx-auto flex size-20 items-center justify-center rounded-full bg-red-50 border-4 border-white shadow-lg mb-6";
                iconSvg.innerHTML = '<path d="M6 18L18 6M6 6l12 12" />';
                confirmBtn.className = "flex-1 inline-flex justify-center rounded-2xl bg-red-600 px-6 py-4 text-sm font-black text-white shadow-xl shadow-red-600/30 hover:bg-red-700 transition-all";
            } else if (config.type === 'warning') {
                iconBox.className = "mx-auto flex size-20 items-center justify-center rounded-full bg-amber-50 border-4 border-white shadow-lg mb-6";
                iconSvg.innerHTML = '<path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />';
                confirmBtn.className = "flex-1 inline-flex justify-center rounded-2xl bg-amber-500 px-6 py-4 text-sm font-black text-white shadow-xl shadow-amber-500/30 hover:bg-amber-600 transition-all";
            } else if (config.type === 'info') {
                iconBox.className = "mx-auto flex size-20 items-center justify-center rounded-full bg-blue-50 border-4 border-white shadow-lg mb-6";
                iconSvg.innerHTML = '<path d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z" />';
                confirmBtn.className = "flex-1 inline-flex justify-center rounded-2xl bg-blue-500 px-6 py-4 text-sm font-black text-white shadow-xl shadow-blue-500/30 hover:bg-blue-600 transition-all";
            } else {
                iconBox.className = "mx-auto flex size-20 items-center justify-center rounded-full bg-furent-50 border-4 border-white shadow-lg mb-6";
                iconSvg.innerHTML = '<path d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />';
                confirmBtn.className = "flex-1 inline-flex justify-center rounded-2xl bg-furent-500 px-6 py-4 text-sm font-black text-white shadow-xl shadow-furent-500/30 hover:bg-furent-600 transition-all";
            }
            dialog.showModal();
            confirmBtn.onclick = () => { closeGlobalModal(config.onConfirm); };
            cancelBtn.onclick = () => { closeGlobalModal(config.onCancel); };
        };

        window.closeGlobalModal = function(callback) {
            const dialog = document.getElementById('global-dialog');
            if (!dialog) return;
            dialog.classList.remove('open:animate-modal-in');
            dialog.classList.add('animate-modal-out');
            setTimeout(() => {
                dialog.close();
                dialog.classList.remove('animate-modal-out');
                if (callback) callback();
            }, 200);
        }
    </script>

    <script th:inline="javascript">
        // Admin sidebar: active destination + collapsible groups (persisted)
        window.__adminActive = /*[[${activeMenu}]]*/ 'dashboard';
        window.adminGroup = function (key, keys) {
            keys = Array.isArray(keys) ? keys : [];
            var stored = localStorage.getItem('admin.group.' + key);
            var isOpen = stored === null ? keys.indexOf(window.__adminActive) !== -1 : stored === '1';
            return {
                open: isOpen,
                toggle: function () {
                    this.open = !this.open;
                    localStorage.setItem('admin.group.' + key, this.open ? '1' : '0');
                }
            };
        };
    </script>
</head>
<body class="text-surface-800 min-h-screen flex antialiased" x-data="{ mobileNav: false }">

    <!-- Mobile nav trigger -->

            class="lg:hidden fixed left-0 top-1/2 -translate-y-1/2 z-[60] rounded-r-xl bg-[#18181b] border border-l-0 border-zinc-800 text-white p-2 shadow-xl"
            aria-label="Abrir navegación">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/></svg>

                                <span class="truncate">Pagos Trabajadores</span>
                            </a>
                        </div>
                    </div>

                </div>
            </nav>

            <!-- User card -->
            <div class="p-3 border-t border-zinc-800/80" x-data="{ open: false }" @click.outside="open = false" @keydown.escape.window="open = false">
                <div class="relative">
                    <button type="button" @click="open = !open" :aria-expanded="open"
                            class="w-full flex items-center gap-3 px-2 py-2 rounded-lg hover:bg-white/[0.05] transition-colors text-left focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-furent-500/60">
                        <img th:src="@{https://ui-avatars.com/api/(name=${currentUser != null and currentUser.nombre != null ? currentUser.nombre : 'A'},background='E07A3A',color='fff')}" alt="" class="w-8 h-8 rounded-full object-cover ring-1 ring-zinc-700/70 shrink-0">
                        <div class="min-w-0 flex-1">
                            <p class="text-[13px] font-semibold text-white leading-tight truncate" th:text="${currentUser != null ? currentUser.nombre : 'Admin'}">Admin</p>
                            <p class="text-[11px] text-zinc-400 leading-tight truncate" th:text="${currentUser != null ? currentUser.email : 'admin@furent.com'}">admin@furent.com</p>
                        </div>
                        <svg class="w-4 h-4 text-zinc-500 shrink-0 transition-transform duration-200" :class="open ? 'rotate-180' : ''" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
                    </button>
                    <div x-show="open" x-cloak x-transition.origin.bottom
                         class="absolute bottom-full left-1 right-1 mb-2 rounded-xl bg-zinc-800 border border-zinc-700/70 shadow-2xl p-1.5 z-10">
                        <a th:href="@{/}" class="flex items-center gap-2.5 px-3 py-2 rounded-lg text-[13px] font-medium text-zinc-200 hover:bg-white/[0.06] transition-colors">
                            <svg class="w-4 h-4 text-zinc-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 003 8.25v10.5A2.25 2.25 0 005.25 21h10.5A2.25 2.25 0 0018 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25"/></svg>
                            Ver sitio
                        </a>
                        <form th:action="@{/logout}" method="post" class="m-0">
                            <button type="submit" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-[13px] font-medium text-red-400 hover:bg-red-500/10 transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75"/></svg>
                                Cerrar sesión
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 min-w-0 min-h-screen pb-12 bg-[#fafafa] dark:bg-[#0f0f11] ml-0 lg:ml-[276px]">
        <!-- Content gets injected here -->
        <div th:replace="${content}"></div>
    </main>


    <!-- Global Toast Container -->
    <div id="toast-container" class="fixed top-24 right-5 z-[200] flex flex-col gap-4 pointer-events-none w-full max-w-sm"></div>

    <!-- Global Modal Dialog (Tailwind Plus) -->
    <el-dialog>
      <dialog id="global-dialog" aria-labelledby="modal-title" class="fixed inset-0 size-auto max-h-none max-w-none overflow-y-auto bg-transparent backdrop:bg-transparent focus:outline-none open:animate-modal-in">
        <el-dialog-backdrop class="fixed inset-0 bg-surface-950/40 backdrop-blur-md transition-opacity data-closed:opacity-0 data-enter:duration-500 data-enter:ease-out data-leave:duration-300 data-leave:ease-in"></el-dialog-backdrop>
    
        <div class="flex min-h-full items-center justify-center p-6 text-center focus:outline-none">
          <el-dialog-panel class="relative transform overflow-hidden rounded-[2.5rem] bg-white text-left shadow-[0_20px_70px_-10px_rgba(0,0,0,0.15)] transition-all data-closed:scale-95 data-closed:opacity-0 data-enter:duration-500 data-enter:ease-out data-leave:duration-300 data-leave:ease-in sm:w-full sm:max-w-md data-closed:sm:translate-y-4 border border-surface-100 dark:border-surface-700/50">
            <!-- Close Button -->
            <button onclick="closeGlobalModal()" class="absolute right-6 top-6 z-50 p-2 text-surface-400 hover:text-surface-900 dark:hover:text-white hover:bg-surface-100 dark:hover:bg-surface-800 rounded-full transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
            <div class="bg-white px-8 pt-12 pb-8 sm:px-12 sm:pt-14 sm:pb-10">
              <div class="text-center">
                <div id="modal-icon-box" class="mx-auto flex size-20 items-center justify-center rounded-full bg-furent-50 border-4 border-white shadow-lg shadow-furent-500/10 mb-6">
                  <svg id="modal-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="size-8 text-furent-500">
                  </svg>
                </div>
                <h3 id="modal-title" class="text-3xl font-black tracking-tight text-surface-950 dark:text-white leading-tight">Título</h3>
                <div id="modal-msg-container" class="mt-4">
                  <p id="modal-message" class="text-[14px] font-medium text-surface-500 dark:text-surface-400 leading-relaxed text-pretty">Mensaje</p>
                </div>
                <div id="modal-html" class="mt-6 hidden text-left scrollbar-hide overflow-y-auto max-h-[60vh] pr-2"></div>
                <div id="modal-list" class="mt-8 space-y-2.5 max-h-48 overflow-y-auto pr-1 py-1 hidden"></div>
                <p id="modal-footer" class="mt-8 text-[11px] font-bold text-surface-400 italic flex items-center justify-center gap-2 hidden"></p>
              </div>
            </div>
            <div class="bg-surface-50/50 px-8 py-8 sm:px-12 flex flex-col sm:flex-row-reverse gap-3">
              <button type="button" id="modal-confirm-btn" class="flex-1 inline-flex justify-center rounded-2xl bg-furent-500 px-6 py-4 text-sm font-black text-white shadow-xl shadow-furent-500/30 hover:bg-furent-600 transition-all">
                Entendido
              </button>
              <button type="button" id="modal-cancel-btn" class="flex-1 inline-flex justify-center rounded-2xl bg-white px-6 py-4 text-sm font-black text-surface-700 border border-surface-200 hover:bg-surface-50 transition-all hidden">
                Cancelar
              </button>
            </div>
          </el-dialog-panel>
        </div>
      </dialog>
    </el-dialog>

    <script th:inline="javascript">
        $(document).ready(function() {
            var successMsg = /*[[${success}]]*/ null;
            if (successMsg) showToast(successMsg, 'success');
            var errorMsg = /*[[${error}]]*/ null;
            if (errorMsg) showToast(errorMsg, 'error');
        });
    </script>
</body>
</html>
