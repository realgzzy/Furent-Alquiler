# ═══════════════════════════════════════════════════════
# FURENT - Production Configuration (SaaS Enterprise)
# ═══════════════════════════════════════════════════════

# Thymeleaf
spring.thymeleaf.cache=true

# MongoDB (override with env variable)
spring.mongodb.uri=${MONGODB_URI}

# Cache (en memoria por defecto para despliegue sin Redis)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.cache.type=${CACHE_TYPE:simple}
furent.features.cache-enabled=${CACHE_ENABLED:false}

# Session Security - stricter in production
server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax

# Admin password (default seguro si no se especifica)
furent.admin.password=${ADMIN_PASSWORD:AdminFurent2026!}


# Actuator - Prometheus + Health in production
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.prometheus.metrics.export.enabled=true

# Logging - production-level (JSON structured via logback-spring.xml)
logging.level.com.alquiler.furent=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.cache=WARN

# Compression
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json
server.compression.min-response-size=1024

# Security Headers
server.servlet.session.cookie.max-age=900
