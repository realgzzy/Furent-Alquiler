# ═══════════════════════════════════════════════════════
# FURENT - Render Blueprint (100% Free Tier, No Redis Required)
# Despliegue Unificado: Spring Boot 4 + Python Optimizer
# ═══════════════════════════════════════════════════════

services:
  - type: web
    name: furent-app
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /login
    envVars:
      - key: PORT
        value: "8080"
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: CACHE_TYPE
        value: simple
      - key: CACHE_ENABLED
        value: "false"
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
